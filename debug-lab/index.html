<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Debug Lab</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --panel-2: #eef1f5;
        --line: #d9dee8;
        --text: #2f3747;
        --muted: #687386;
        --ok: #0b9f6a;
        --warn: #f08a24;
        --bad: #d64545;
        --info: #5468ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button,
      select,
      input {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        color: var(--text);
        font: inherit;
        padding: 8px 10px;
      }
      button {
        cursor: pointer;
      }
      button.primary {
        background: var(--info);
        border-color: var(--info);
        color: white;
      }
      button.danger {
        background: #fff3f3;
        color: var(--bad);
        border-color: #f2b8b8;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(247, 248, 251, 0.95);
        backdrop-filter: blur(8px);
      }
      h1,
      h2,
      h3 {
        margin: 0;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 18px;
      }
      h3 {
        font-size: 15px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
      }
      .wrap {
        display: grid;
        gap: 14px;
        padding: 14px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .stat {
        background: var(--panel-2);
        border-radius: 6px;
        padding: 10px;
      }
      .stat strong {
        display: block;
        margin-top: 4px;
        font-size: 20px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 12px;
        color: var(--muted);
        background: white;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .ok .dot,
      .dot.ok {
        background: var(--ok);
      }
      .warn .dot,
      .dot.warn {
        background: var(--warn);
      }
      .bad .dot,
      .dot.bad {
        background: var(--bad);
      }
      .canvas {
        min-height: 300px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 32px 32px;
        padding: 14px;
      }
      .lanes {
        display: grid;
        grid-template-columns: 1fr 1fr 1.2fr;
        gap: 12px;
        min-width: 900px;
      }
      .lane {
        display: grid;
        align-content: start;
        gap: 8px;
      }
      .node {
        border-left: 4px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(20, 30, 50, 0.08);
        padding: 10px;
      }
      .node.good {
        border-left-color: var(--ok);
      }
      .node.warn {
        border-left-color: var(--warn);
      }
      .node.bad {
        border-left-color: var(--bad);
      }
      .line {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
        word-break: break-word;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .table th,
      .table td {
        border-bottom: 1px solid var(--line);
        padding: 7px;
        text-align: left;
        vertical-align: top;
      }
      .table th {
        color: var(--muted);
        font-weight: 600;
      }
      .chart {
        width: 100%;
        height: 130px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }
      .log {
        height: 170px;
        overflow: auto;
        background: #111827;
        color: #d6e4ff;
        border-radius: 8px;
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
      @media (max-width: 1100px) {
        .grid2,
        .grid4 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Debug Lab</h1>
        <div class="sub">실제 kind-management / kind-target 관측 및 더미 워크로드 장애 주입</div>
      </div>
      <div class="toolbar">
        <span id="gateway-pill" class="pill"><span class="dot"></span>Gateway 확인 중</span>
        <span id="updated" class="sub">-</span>
        <button id="refresh">새로고침</button>
        <button id="bootstrap" class="primary">더미 설치/갱신</button>
      </div>
    </header>

    <main class="wrap">
      <section class="panel">
        <h2>액션</h2>
        <div class="toolbar" style="margin-top: 10px">
          <label>클러스터 <select id="cluster">
            <option value="management">management</option>
            <option value="target" selected>target</option>
          </select></label>
          <label>워크로드 <select id="workload">
            <option value="demo-checkout">demo-checkout</option>
            <option value="demo-payments">demo-payments</option>
          </select></label>
          <button data-action="scale" data-value="0">Pod 0</button>
          <button data-action="scale" data-value="1">Pod 1</button>
          <button data-action="scale" data-value="3">Pod 3</button>
          <button data-action="scale" data-value="10">Pod 10</button>
          <button data-action="scale" data-value="30">Pod 30</button>
          <button data-action="rollout">Rolling restart</button>
          <button data-action="delete-pod">Pod 삭제</button>
          <button data-action="image">이미지 revision</button>
          <button data-action="readiness-fail" class="danger">Readiness 실패</button>
          <button data-action="readiness-ok">Readiness 복구</button>
          <button data-action="crash-on" class="danger">CrashLoop 켜기</button>
          <button data-action="crash-off">CrashLoop 끄기</button>
          <button data-action="delay-on" data-value="1000">Delay 켜기</button>
          <button data-action="delay-off">Delay 끄기</button>
          <button data-action="cpu-on">CPU 부하</button>
          <button data-action="cpu-off">CPU 중지</button>
          <button data-action="memory-on" data-value="128">Memory 부하</button>
          <button data-action="memory-off">Memory 중지</button>
          <button data-action="reset">리셋</button>
        </div>
      </section>

      <section class="grid2" id="cluster-panels"></section>

      <section class="panel">
        <h2>시계열</h2>
        <div class="grid2" style="margin-top: 10px">
          <div>
            <h3>management ready/pod</h3>
            <canvas id="chart-management" class="chart"></canvas>
          </div>
          <div>
            <h3>target ready/pod</h3>
            <canvas id="chart-target" class="chart"></canvas>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>명령 로그</h2>
        <div id="log" class="log">ready</div>
      </section>
    </main>

    <script>
      const series = {
        management: { ready: [], pods: [], desired: [] },
        target: { ready: [], pods: [], desired: [] },
      }
      let latestState = null
      let busy = false
      let refreshing = false

      const $ = (id) => document.getElementById(id)
      const logBox = $('log')
      const log = (line) => {
        const time = new Date().toLocaleTimeString()
        logBox.textContent = `[${time}] ${line}\n` + logBox.textContent
      }
      const esc = (value) =>
        String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
      const tone = (ok, warn = false) => ok ? 'good' : warn ? 'warn' : 'bad'
      const dotTone = (ok, warn = false) => ok ? 'ok' : warn ? 'warn' : 'bad'
      const fmt = (n) => Number.isFinite(Number(n)) ? Number(n) : 0

      async function api(path, options = {}) {
        const res = await fetch(path, {
          headers: { 'content-type': 'application/json' },
          ...options,
        })
        const data = await res.json()
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || data.result?.stderr || data.stderr || `HTTP ${res.status}`)
        }
        return data
      }

      function updateSeries(state) {
        for (const name of Object.keys(series)) {
          const cluster = state.clusters[name]
          if (!cluster) continue
          const summary = cluster.summary
          const desired = cluster.deployments.reduce((sum, item) => sum + fmt(item.desired), 0)
          series[name].ready.push(fmt(summary.readyPods))
          series[name].pods.push(fmt(summary.pods))
          series[name].desired.push(desired)
          for (const key of Object.keys(series[name])) {
            series[name][key] = series[name][key].slice(-80)
          }
        }
      }

      function drawChart(id, data) {
        const canvas = $(id)
        const rect = canvas.getBoundingClientRect()
        const scale = window.devicePixelRatio || 1
        canvas.width = Math.max(1, Math.floor(rect.width * scale))
        canvas.height = Math.max(1, Math.floor(rect.height * scale))
        const ctx = canvas.getContext('2d')
        ctx.scale(scale, scale)
        ctx.clearRect(0, 0, rect.width, rect.height)
        ctx.strokeStyle = '#d9dee8'
        ctx.lineWidth = 1
        for (let i = 0; i < 5; i++) {
          const y = 10 + (rect.height - 20) * i / 4
          ctx.beginPath()
          ctx.moveTo(8, y)
          ctx.lineTo(rect.width - 8, y)
          ctx.stroke()
        }
        const max = Math.max(1, ...data.ready, ...data.pods, ...data.desired)
        const draw = (values, color) => {
          ctx.strokeStyle = color
          ctx.lineWidth = 2
          ctx.beginPath()
          values.forEach((value, index) => {
            const x = 8 + (rect.width - 16) * index / Math.max(values.length - 1, 1)
            const y = rect.height - 10 - (rect.height - 24) * value / max
            if (index === 0) ctx.moveTo(x, y)
            else ctx.lineTo(x, y)
          })
          ctx.stroke()
        }
        draw(data.pods, '#687386')
        draw(data.ready, '#0b9f6a')
        draw(data.desired, '#5468ff')
        ctx.fillStyle = '#687386'
        ctx.font = '12px sans-serif'
        ctx.fillText('pods(gray) ready(green) desired(blue)', 10, 18)
      }

      function workloadRows(cluster, deployments) {
        return deployments
          .filter((item) => item.debugLab || ['management', 'sandbox', 'target'].includes(item.namespace))
          .sort((a, b) => Number(b.debugLab) - Number(a.debugLab) || a.namespace.localeCompare(b.namespace))
      }

      function renderCanvas(cluster) {
        const deployments = workloadRows(cluster.name, cluster.deployments)
        const rs = cluster.replicasets
        const pods = cluster.pods
        return `
          <div class="canvas">
            <div class="lanes">
              <div class="lane">
                <h3>Deployment</h3>
                ${deployments.map((item) => {
                  const ok = item.desired > 0 && item.ready === item.desired
                  const warn = item.desired === 0
                  return `<div class="node ${tone(ok, warn)}">
                    <strong>${esc(item.name)}</strong>
                    <div class="line">${esc(item.namespace)} · ${item.ready}/${item.desired} ready · available ${item.available}</div>
                    <div class="line">${esc(item.image)}</div>
                  </div>`
                }).join('') || '<div class="node warn">Deployment 없음</div>'}
              </div>
              <div class="lane">
                <h3>ReplicaSet</h3>
                ${rs.filter((item) => deployments.some((dep) => dep.name === item.deployment && dep.namespace === item.namespace)).slice(0, 24).map((item) => `
                  <div class="node ${tone(item.desired > 0 && item.ready === item.desired, item.desired === 0)}">
                    <strong>${esc(item.name)}</strong>
                    <div class="line">${esc(item.namespace)} · ${esc(item.deployment)}</div>
                    <div class="line">${item.ready}/${item.desired} ready</div>
                  </div>
                `).join('') || '<div class="node warn">ReplicaSet 없음</div>'}
              </div>
              <div class="lane">
                <h3>Pod</h3>
                ${pods.filter((pod) => deployments.some((dep) => dep.namespace === pod.namespace && (dep.app === pod.app || dep.name === pod.app))).slice(0, 40).map((pod) => `
                  <div class="node ${tone(pod.ready, pod.phase === 'Running')}">
                    <strong>${esc(pod.name)}</strong>
                    <div class="line">${esc(pod.namespace)} · ${esc(pod.phase)} · ready ${pod.ready}</div>
                    <div class="line">restart ${pod.restarts} · ${esc(pod.podIP || 'no-ip')} · ${esc(pod.reason)}</div>
                  </div>
                `).join('') || '<div class="node warn">Pod 없음</div>'}
              </div>
            </div>
          </div>
        `
      }

      function renderTables(cluster) {
        const jobRows = cluster.jobs.slice(0, 12).map((job) => `
          <tr><td>${esc(job.namespace)}</td><td>${esc(job.name)}</td><td>${job.active}</td><td>${job.succeeded}</td><td>${job.failed}</td></tr>
        `).join('')
        const endpointRows = cluster.endpoints
          .filter((endpoint) => endpoint.ready || endpoint.notReady || endpoint.namespace === 'debug-lab')
          .slice(0, 16)
          .map((endpoint) => `
            <tr><td>${esc(endpoint.namespace)}</td><td>${esc(endpoint.name)}</td><td>${endpoint.ready}</td><td>${endpoint.notReady}</td><td>${esc(endpoint.ports.join(','))}</td></tr>
          `).join('')
        const podRows = cluster.pods.slice(0, 20).map((pod) => `
          <tr><td>${esc(pod.namespace)}</td><td>${esc(pod.name)}</td><td>${esc(pod.phase)}</td><td>${pod.ready}</td><td>${pod.restarts}</td><td>${esc(pod.podIP || '-')}</td><td>${esc(pod.reason)}</td></tr>
        `).join('')
        return `
          <details open>
            <summary>Pod / Job / Endpoint</summary>
            <h3>Pods</h3>
            <table class="table"><thead><tr><th>ns</th><th>name</th><th>phase</th><th>ready</th><th>restart</th><th>ip</th><th>reason</th></tr></thead><tbody>${podRows}</tbody></table>
            <h3 style="margin-top:12px">Jobs</h3>
            <table class="table"><thead><tr><th>ns</th><th>name</th><th>active</th><th>succeeded</th><th>failed</th></tr></thead><tbody>${jobRows || '<tr><td colspan="5">Job 없음</td></tr>'}</tbody></table>
            <h3 style="margin-top:12px">Endpoints</h3>
            <table class="table"><thead><tr><th>ns</th><th>name</th><th>ready</th><th>not ready</th><th>ports</th></tr></thead><tbody>${endpointRows || '<tr><td colspan="5">Endpoint 없음</td></tr>'}</tbody></table>
          </details>
        `
      }

      function renderCluster(cluster) {
        const s = cluster.summary
        const metricsText = cluster.top.nodes.ok ? `${cluster.top.nodes.rows.length} node metrics` : `metrics 없음: ${cluster.top.nodes.error || 'unknown'}`
        return `
          <section class="panel">
            <div class="toolbar" style="justify-content:space-between">
              <div>
                <h2>${esc(cluster.name)} cluster</h2>
                <div class="sub">${esc(cluster.context)} · namespaces ${esc(cluster.namespaces.join(', '))}</div>
              </div>
              <span class="pill ${s.readyNodes === s.nodes ? 'ok' : 'warn'}"><span class="dot"></span>${s.readyNodes}/${s.nodes} nodes</span>
            </div>
            <div class="grid4" style="margin-top:10px">
              <div class="stat"><span class="sub">Deployment</span><strong>${s.readyDeployments}/${s.deployments}</strong></div>
              <div class="stat"><span class="sub">Pod ready/running</span><strong>${s.readyPods}/${s.runningPods}/${s.pods}</strong></div>
              <div class="stat"><span class="sub">Endpoint ready/not</span><strong>${s.readyEndpoints}/${s.notReadyEndpoints}</strong></div>
              <div class="stat"><span class="sub">Failed Job</span><strong>${s.failedJobs}</strong></div>
            </div>
            <div class="sub" style="margin:10px 0">${esc(metricsText)}</div>
            ${cluster.errors.map((e) => `<div class="pill bad"><span class="dot"></span>${esc(e.resource)} ${esc(e.error)}</div>`).join('')}
            ${renderCanvas(cluster)}
            ${renderTables(cluster)}
          </section>
        `
      }

      function render(state) {
        latestState = state
        updateSeries(state)
        $('updated').textContent = new Date(state.generatedAt * 1000).toLocaleTimeString()
        const gatewayOk = state.gateway.healthz.ok && state.gateway.readyz.ok
        $('gateway-pill').className = `pill ${gatewayOk ? 'ok' : 'bad'}`
        $('gateway-pill').innerHTML = `<span class="dot"></span>Gateway ${gatewayOk ? 'ready' : 'down'}`
        $('cluster-panels').innerHTML = Object.values(state.clusters).map(renderCluster).join('')
        drawChart('chart-management', series.management)
        drawChart('chart-target', series.target)
      }

      async function refresh(force = false) {
        if (refreshing) return
        refreshing = true
        try {
          const state = await api(`/api/state${force ? '?force=1' : ''}`)
          render(state)
        } finally {
          refreshing = false
        }
      }

      async function postAction(action, value) {
        if (busy) return
        busy = true
        document.querySelectorAll('button').forEach((button) => button.disabled = true)
        const cluster = $('cluster').value
        const workload = $('workload').value
        try {
          log(`${cluster}/${workload} ${action}${value !== undefined ? `=${value}` : ''} 요청`)
          const result = await api('/api/action', {
            method: 'POST',
            body: JSON.stringify({ cluster, workload, action, value }),
          })
          log(`완료: ${JSON.stringify(result.result || result.results || result).slice(0, 500)}`)
          await refresh(true)
        } catch (error) {
          log(`오류: ${error.message}`)
        } finally {
          busy = false
          document.querySelectorAll('button').forEach((button) => button.disabled = false)
        }
      }

      $('refresh').addEventListener('click', () => refresh(true).catch((error) => log(`refresh 오류: ${error.message}`)))
      $('bootstrap').addEventListener('click', async () => {
        if (busy) return
        busy = true
        document.querySelectorAll('button').forEach((button) => button.disabled = true)
        try {
          log('더미 workload 설치/갱신')
          const result = await api('/api/bootstrap', { method: 'POST', body: JSON.stringify({}) })
          log(`bootstrap 완료: ${JSON.stringify(result.results).slice(0, 600)}`)
          await refresh(true)
        } catch (error) {
          log(`bootstrap 오류: ${error.message}`)
        } finally {
          busy = false
          document.querySelectorAll('button').forEach((button) => button.disabled = false)
        }
      })
      document.querySelectorAll('[data-action]').forEach((button) => {
        button.addEventListener('click', () => postAction(button.dataset.action, button.dataset.value))
      })

      refresh(true).catch((error) => log(`초기 로딩 오류: ${error.message}`))
      setInterval(() => refresh(false).catch((error) => log(`poll 오류: ${error.message}`)), 5000)
    </script>
  </body>
</html>
