# RCA 원인 룰 카탈로그 — 네트워크(DNS/timeout/Ingress) 계열 (구 causes/network.py)
rules:
  - id: "dns_lookup_failed"
    symptoms: ["DNS lookup failed"]
    required_sources: ["kubernetes", "metrics", "logs", "metadata"]
    candidates:
      - candidate_id: "service_dns_resolution_failure"
        title: "서비스 DNS 해석 실패"
        description: "Service, Endpoint, DNS 응답 문제로 서비스 이름 해석이 실패했을 가능성이 있습니다."
        expected_evidence: ["kubernetes", "metrics", "logs", "metadata"]
        checks:
          - "Service.spec.clusterIP와 EndpointSlice.endpoints가 정상인지 확인"
          - "CoreDNS 응답 코드에서 NXDOMAIN 또는 SERVFAIL 증가 확인"
          - "로그에 no such host, DNS lookup failed, name resolution failed 확인"
          - "최근 Service selector, namespace, NetworkPolicy 변경 여부 확인"
  - id: "connection_timeout"
    symptoms: ["Connection timeout"]
    required_sources: ["kubernetes", "metrics", "logs", "traces", "metadata"]
    candidates:
      - candidate_id: "network_path_timeout"
        title: "네트워크 경로 timeout"
        description: "Service, NetworkPolicy, ingress/egress 경로 문제로 대상 연결이 timeout됐을 가능성이 있습니다."
        expected_evidence: ["kubernetes", "metrics", "logs", "traces", "metadata"]
        checks:
          - "NetworkPolicy.spec ingress/egress가 source/target 통신을 허용하는지 확인"
          - "EndpointSlice.conditions.ready와 Pod IP가 유효한지 확인"
          - "service mesh 또는 ingress timeout metric 증가 확인"
          - "trace에서 upstream timeout 또는 context deadline exceeded 확인"
  - id: "ingress_5xx"
    symptoms: ["Ingress 502/503", "Ingress 502", "Ingress 503"]
    required_sources: ["kubernetes", "metrics", "logs", "metadata"]
    candidates:
      - candidate_id: "upstream_unavailable"
        title: "Ingress upstream 불가"
        description: "Ingress가 연결할 Service endpoint가 없거나 upstream 연결 실패로 502/503이 발생했을 가능성이 있습니다."
        expected_evidence: ["kubernetes", "metrics", "logs", "metadata"]
        checks:
          - "Ingress.status, Service.spec.selector, EndpointSlice.endpoints 확인"
          - "ingress 502/503 metric 또는 upstream connect failure 증가 확인"
          - "ingress controller log에 no endpoints, upstream error, connection refused 확인"
          - "최근 Ingress, Service, Deployment 변경 이후 발생했는지 확인"
      - candidate_id: "backend_readiness_failure"
        title: "백엔드 readiness 실패"
        description: "백엔드 Pod가 Ready 상태가 아니어서 Ingress upstream에서 제외됐을 가능성이 있습니다."
        expected_evidence: ["kubernetes", "metrics", "logs"]
        checks:
          - "Pod status.conditions Ready=False 여부 확인"
          - "kube_endpoint_address_available 또는 ready endpoint 수 감소 확인"
          - "readiness probe 실패 이벤트와 app log 확인"
