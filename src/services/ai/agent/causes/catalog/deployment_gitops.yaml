# RCA 원인 룰 카탈로그 — Deployment rollout / GitOps sync 계열 (구 causes/deployment_gitops.py)
rules:
  - id: "deployment_rollout_failed"
    symptoms: ["ProgressDeadlineExceeded", "Rollout failed"]
    required_sources: ["kubernetes", "metrics", "logs", "metadata"]
    candidates:
      - candidate_id: "deployment_progress_deadline_exceeded"
        title: "Deployment rollout 진행 기한 초과"
        description: "새 ReplicaSet의 Pod가 Ready로 전환되지 못해 Deployment rollout이 실패했을 가능성이 있습니다."
        expected_evidence: ["kubernetes", "metrics", "logs", "metadata"]
        checks:
          - "Deployment.status.conditions.reason == ProgressDeadlineExceeded 확인"
          - "updatedReplicas 대비 availableReplicas가 부족한지 확인"
          - "신규 ReplicaSet Pod의 probe 실패, CrashLoopBackOff, ImagePullBackOff 확인"
          - "image digest, git_sha, helm revision 변경 이후 발생했는지 확인"
      - candidate_id: "replica_unavailable_after_rollout"
        title: "Rollout 이후 replica unavailable"
        description: "배포 이후 원하는 replica 수만큼 ready Pod가 확보되지 않았을 가능성이 있습니다."
        expected_evidence: ["kubernetes", "metrics", "logs"]
        checks:
          - "Deployment.status.unavailableReplicas와 ReplicaSet.readyReplicas 확인"
          - "kube_deployment_status_replicas_unavailable 증가 확인"
          - "신규 Pod의 readiness/startup error 로그 확인"
  - id: "argocd_sync_failed"
    symptoms: ["ArgoCD Sync Failed", "Sync Failed"]
    required_sources: ["kubernetes", "metrics", "logs", "metadata"]
    candidates:
      - candidate_id: "gitops_sync_failed"
        title: "GitOps sync 실패"
        description: "ArgoCD Application sync 과정에서 manifest render 또는 apply가 실패했을 가능성이 있습니다."
        expected_evidence: ["kubernetes", "metrics", "logs", "metadata"]
        checks:
          - "Application.status.sync.status와 Application.status.conditions 확인"
          - "argocd_app_sync_total 또는 app sync failed metric 확인"
          - "argocd application controller/repo-server log에서 render/apply 오류 확인"
          - "git revision, manifest path, Helm values 변경 이후 실패했는지 확인"
      - candidate_id: "manifest_validation_failed"
        title: "Manifest 검증 실패"
        description: "Kubernetes API schema 또는 admission 정책 검증에서 manifest가 거부됐을 가능성이 있습니다."
        expected_evidence: ["kubernetes", "logs", "metadata"]
        checks:
          - "kubectl apply dry-run 또는 AdmissionReview denied 응답 확인"
          - "API version, required field, immutable field 오류 확인"
          - "위반 필드가 최근 Git commit 변경분과 연결되는지 확인"
