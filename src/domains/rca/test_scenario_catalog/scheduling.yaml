scenarios:
  - scenario_id: "schedule.cpu"
    version: 1
    title: "CPU 부족 스케줄링 실패"
    description: "클러스터보다 큰 CPU request를 가진 테스트 Pod로 FailedScheduling을 만듭니다."
    execution: "real"
    availability: "ready"
    expected:
      root_cause: "insufficient_cpu"
      symptom: "FailedScheduling"
    evidence_sources: ["kubernetes"]
    safety: &sandbox_safety
      namespace: "sandbox"
      cleanup_required: true
      ttl_seconds: 300
      management_cluster_allowed: false
      resource_name_prefix: "rca-test-"
      max_concurrent_runs: 1
    trigger:
      adapter: "kubernetes.deployment"
      params:
        resource_name: "rca-test-schedule-cpu"
        fault_mode: "insufficient_cpu"
        replicas: 1
        labels: {"kubeheal.io/rca-test": "true"}
    observe:
      timeout_seconds: 90
      poll_seconds: 2
      event_reasons: ["FailedScheduling"]
      event_message_any: ["Insufficient cpu"]
    cleanup: &scale_cleanup
      adapter: "kubernetes.deployment_scale"
      params: {replicas: 0}

  - scenario_id: "schedule.memory"
    version: 1
    title: "Memory 부족 스케줄링 실패"
    description: "클러스터보다 큰 memory request를 가진 테스트 Pod로 FailedScheduling을 만듭니다."
    execution: "real"
    availability: "ready"
    expected:
      root_cause: "insufficient_memory"
      symptom: "FailedScheduling"
    evidence_sources: ["kubernetes"]
    safety: *sandbox_safety
    trigger:
      adapter: "kubernetes.deployment"
      params:
        resource_name: "rca-test-schedule-memory"
        fault_mode: "insufficient_memory"
        replicas: 1
        labels: {"kubeheal.io/rca-test": "true"}
    observe:
      timeout_seconds: 90
      poll_seconds: 2
      event_reasons: ["FailedScheduling"]
      event_message_any: ["Insufficient memory"]
    cleanup: *scale_cleanup

  - scenario_id: "schedule.affinity"
    version: 1
    title: "Node affinity 불일치"
    description: "존재하지 않는 node label affinity를 요구해 실제 FailedScheduling을 만듭니다."
    execution: "real"
    availability: "ready"
    expected:
      root_cause: "node_affinity_or_taint_mismatch"
      symptom: "FailedScheduling"
    evidence_sources: ["kubernetes"]
    safety: *sandbox_safety
    trigger:
      adapter: "kubernetes.deployment"
      params:
        resource_name: "rca-test-schedule-affinity"
        fault_mode: "affinity_mismatch"
        replicas: 1
        labels: {"kubeheal.io/rca-test": "true"}
    observe:
      timeout_seconds: 90
      poll_seconds: 2
      event_reasons: ["FailedScheduling"]
      event_message_any: ["affinity", "didn't match"]
    cleanup: *scale_cleanup

  - scenario_id: "schedule.pvc"
    version: 1
    title: "PVC 바인딩 대기"
    description: "바인딩되지 않는 테스트 PVC를 mount해 Pending/FailedScheduling을 재현합니다."
    execution: "real"
    availability: "fixture_required"
    availability_reason: "클러스터 StorageClass 구성에 영향받지 않는 격리된 PVC fixture가 필요합니다."
    fixture_requirements:
      - "sandbox 전용 미바인딩 StorageClass 또는 PVC"
      - "cleanup 시 PVC를 복구하는 adapter"
    expected:
      root_cause: "pvc_pending"
      symptom: "FailedScheduling"
    evidence_sources: ["kubernetes"]
    safety: *sandbox_safety
    trigger:
      adapter: "kubernetes.deployment"
      params:
        resource_name: "rca-test-schedule-pvc"
        fault_mode: "pvc_pending"
        replicas: 1
        labels: {"kubeheal.io/rca-test": "true"}
    observe:
      timeout_seconds: 120
      poll_seconds: 2
      event_reasons: ["FailedScheduling"]
      event_message_any: ["persistentvolumeclaim", "unbound"]
    cleanup: *scale_cleanup
