1050" y="216" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="1050" dy="0">Target Cluster Agent</tspan></text><text x="928" y="260" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="928" dy="0">actual state 조회</tspan><tspan x="928" dy="23">명령 수신 / 정책 guard</tspan></text><rect x="910" y="348" width="280" height="122" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 6"/><line x1="910" y1="394" x2="1190" y2="394" stroke="#22c55e" stroke-width="2"/><text x="1050" y="379" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="1050" dy="0">Agent GitOps Executor</tspan></text><text x="928" y="423" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="928" dy="0">dry-run / server-side apply</tspan><tspan x="928" dy="23">rollout watch / actual snapshot</tspan></text><rect x="910" y="510" width="280" height="100" rx="8" fill="white" stroke="#22c55e" stroke-width="2"/><line x1="910" y1="556" x2="1190" y2="556" stroke="#22c55e" stroke-width="2"/><text x="1050" y="541" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="1050" dy="0">Kubernetes API + RBAC</tspan></text><text x="928" y="585" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="928" dy="0">sandbox namespace만 write</tspan><tspan x="928" dy="23">pods/events/nodes/services read</tspan></text><line x1="1050" y1="307" x2="1050" y2="348" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="1050" y1="470" x2="1050" y2="510" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="92" y="538" width="710" height="92" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="120" y="575" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="18" font-weight="800" fill="#111827" text-anchor="start"><tspan x="120" dy="0">핵심 판단: credential을 Management Plane에 많이 저장하지 않기 위해</tspan><tspan x="120" dy="26">실제 apply는 Target Agent 쪽으로 이동한다.</tspan></text>
