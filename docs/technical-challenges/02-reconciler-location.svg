<text x="112" y="150" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="28" font-weight="900" fill="#111827" text-anchor="start"><tspan x="112" dy="0">Management Plane</tspan></text><text x="885" y="150" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="28" font-weight="900" fill="#111827" text-anchor="start"><tspan x="885" dy="0">Target Cluster</tspan></text><rect x="86" y="185" width="250" height="122" rx="8" fill="#eaf1ff" stroke="#2f5cf6" stroke-width="2"/><line x1="86" y1="231" x2="336" y2="231" stroke="#2f5cf6" stroke-width="2"/><text x="211" y="216" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="211" dy="0">Workflow Controller</tspan></text><text x="104" y="260" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="104" dy="0">desired state 저장</tspan><tspan x="104" dy="23">승인 단계와 실행 흐름 관리</tspan></text><rect x="86" y="348" width="250" height="122" rx="8" fill="#eaf1ff" stroke="#2f5cf6" stroke-width="2"/><line x1="86" y1="394" x2="336" y2="394" stroke="#2f5cf6" stroke-width="2"/><text x="211" y="379" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="211" dy="0">Command Worker</tspan></text><text x="104" y="423" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="104" dy="0">정책 검사</tspan><tspan x="104" dy="23">agent command queue 생성</tspan></text><rect x="390" y="265" width="260" height="122" rx="8" fill="#eaf1ff" stroke="#2f5cf6" stroke-width="2"/><line x1="390" y1="311" x2="650" y2="311" stroke="#2f5cf6" stroke-width="2"/><text x="520" y=