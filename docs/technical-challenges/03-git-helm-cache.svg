<text x="72" y="74" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="34" font-weight="900" fill="#111827">기술적 챌린지 - Git / Helm Cache와 Artifact</text>
<line x1="72" y1="104" x2="1208" y2="104" stroke="#2f5cf6" stroke-width="2"/>
<rect x="76" y="160" width="240" height="290" rx="8" fill="white" stroke="#374151" stroke-width="2"/><line x1="76" y1="206" x2="316" y2="206" stroke="#374151" stroke-width="2"/><text x="196" y="191" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="196" dy="0">GitHub Repo</tspan></text><text x="94" y="235" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="94" dy="0">branch / PR / commit</tspan><tspan x="94" dy="23">Helm chart / values</tspan><tspan x="94" dy="23">Kustomize / raw YAML</tspan></text><text x="112" y="505" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="start"><tspan x="112" dy="0">문제</tspan><tspan x="112" dy="30">여러 workflow가 매번 clone/render하면</tspan><tspan x="112" dy="30">느리고 실패 지점이 늘어난다.</tspan></text><line x1="326" y1="305" x2="430" y2="305" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="408" cy="236" r="24" fill="#f3cd61"/><text x="408" y="243" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="22" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="408" dy="0">1</tspan></text><rect x="420" y="145" width="450" height="360" rx="4" fill="#f8fbff" stroke="#2f5cf6" stroke-width="4"/><text x="645" y="180" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="32" font-weight="900" fill="#3158e8" text-anchor="middle"><tspan x="645" dy="0">Cache / Render</tspan></text><rect x="456" y="215" width="170" height="112" rx="8" fill="white" stroke="#2f5cf6" stroke-width="2"/><line x1="456" y1="261" x2="626" y2="261" stroke="#2f5cf6" stroke-width="2"/><text x="541" y="235" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="541" dy="0">Git Cache</tspan><tspan x="541" dy="18">Worker</tspan></text><text x="474" y="290" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="474" dy="0">repo mirror/fetch</tspan><tspan x="474" dy="23">commit checkout</tspan></text><rect x="676" y="215" width="170" height="112" rx="8" fill="white" stroke="#2f5cf6" stroke-width="2"/><line x1="676" y1="261" x2="846" y2="261" stroke="#2f5cf6" stroke-width="2"/><text x="761" y="235" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="761" dy="0">Manifest Render</tspan><tspan x="761" dy="18">Worker</tspan></text><text x="694" y="290" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="694" dy="0">Helm / Kustomize</tspan><tspan x="694" dy="23">YAML render</tspan></text><line x1="626" y1="272" x2="676" y2="272" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="532" y="370" width="260" height="90" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/><line x1="532" y1="416" x2="792" y2="416" stroke="#7c3aed" stroke-width="2"/><text x="662" y="390" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="662" dy="0">Object / Secret</tspan><tspan x="662" dy="18">Stores</tspan></text><text x="550" y="445" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="550" dy="0">artifact bundle</tspan><tspan x="550" dy="23">digest / provenance</tspan></text><line x1="758" y1="327" x2="680" y2="370" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="596" y1="327" x2="612" y2="370" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="878" y1="305" x2="950" y2="305" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="902" cy="236" r="24" fill="#f3cd61"/><text x="902" y="243" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="22" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="902" dy="0">2</tspan></text><rect x="950" y="160" width="250" height="122" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><line x1="950" y1="206" x2="1200" y2="206" stroke="#22c55e" stroke-width="2"/><text x="1075" y="191" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="1075" dy="0">Diff Worker</tspan></text><text x="968" y="235" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="968" dy="0">desired manifest와</tspan><tspan x="968" dy="23">actual snapshot 비교</tspan></text><rect x="950" y="342" width="250" height="122" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><line x1="950" y1="388" x2="1200" y2="388" stroke="#22c55e" stroke-width="2"/><text x="1075" y="373" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="1075" dy="0">Target Reconcile Worker</tspan></text><text x="968" y="417" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="968" dy="0">drift/reconcile 이벤트 생성</tspan><tspan x="968" dy="23">배포 상태 추적</tspan></text><line x1="1075" y1="282" x2="1075" y2="342" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="386" y="542" width="638" height="92" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="414" y="579" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="19" font-weight="900" fill="#111827" text-anchor="start"><tspan x="414" dy="0">해결: repo + commit + chart version 기준으로 cache하고,</tspan><tspan x="414" dy="26">결과물은 digest와 provenance로 추적한다.</tspan></text>
</svg>