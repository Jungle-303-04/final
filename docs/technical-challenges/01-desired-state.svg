f" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="580" dy="0">SQL-first</tspan></text><text x="538" y="290" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="538" dy="0">MVP 기준</tspan><tspan x="538" dy="23">빠른 구현</tspan></text><text x="660" y="277" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="28" font-weight="900" fill="#111827" text-anchor="middle"><tspan x="660" dy="0">VS</tspan></text><rect x="682" y="215" width="110" height="108" rx="8" fill="white" stroke="#3158e8" stroke-width="2"/><line x1="682" y1="261" x2="792" y2="261" stroke="#3158e8" stroke-width="2"/><text x="737" y="246" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="20" font-weight="800" fill="#111827" text-anchor="middle"><tspan x="737" dy="0">CRD-first</tspan></text><text x="700" y="290" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="600" fill="#4b5563" text-anchor="start"><tspan x="700" dy="0">운영성</tspan><tspan x="700" dy="23">controller</tspan></text><line x1="652" y1="340" x2="652" y2="390" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="548" y="388" width="210" height="48" rx="8" fill="#3158e8"/><text x="653" y="419" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle"><tspan x="653" dy="0">MVP는 SQL-first</tspan></text><text x="520" y="454" font-family="'Apple SD Gothic Neo', 'AppleGothic', 'Arial Unicode MS', sans-serif" font-size="17" font-weight="700" fill="#243bbd" text-anchor="start"><tspan x="520" dy="0">운영급 전환 시 CRD mirror로 확장</tspan></text><line x1="832" y1="234" x2="938" y2="234" stroke="#6b8fc5" stroke-width="5" stroke-linecap="round" marker-end="url