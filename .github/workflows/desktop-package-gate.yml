name: Desktop Package Gate

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }} package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            bundles: appimage,deb
          - name: macOS
            runner: macos-latest
            bundles: app,dmg
          - name: Windows
            runner: windows-latest
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --include=dev --no-audit --no-fund

      - name: Verify shared frontend and native bridge
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.10.0 --locked

      - name: Verify generated desktop icons
        run: node desktop/scripts/check-icons.mjs

      - name: Build platform installer bundles
        run: cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: desktop

      - name: Upload platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: opsia-desktop-${{ matrix.name }}-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
