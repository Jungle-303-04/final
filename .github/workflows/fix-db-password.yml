name: Fix DB Password (temporary)

# 임시 복구 워크플로.
# deploy/management/secrets.yaml placeholder 가 실제 postgresql-secret 을 덮어써
# 원래 비밀번호가 유실된 상태를 복구한다.
# 새 비밀번호를 클러스터 안에서 생성해 DB(ALTER USER)와 k8s secret 에 동시에 반영한다.
# 값은 로그에 출력되지 않는다. 복구 후 이 파일은 삭제한다.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  fix:
    name: Reset postgres password
    runs-on: ubuntu-latest
    environment: aws-test
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      MGMT_CLUSTER: ${{ vars.MGMT_CLUSTER || 'kubeheal-mgmt' }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reset password in DB and secret
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${MGMT_CLUSTER}" --region "${AWS_REGION}" --alias "${MGMT_CLUSTER}" >/dev/null

          PSQL() {
            kubectl --context "${MGMT_CLUSTER}" -n management exec postgresql-0 -- \
              psql -U "$1" -d postgres -v ON_ERROR_STOP=1 -tAc "$2"
          }

          # 실제 superuser 탐색 (초기화 당시 POSTGRES_USER 에 따라 다름)
          SUPERUSER=""
          for u in service kubeheal postgres; do
            if PSQL "$u" "select 1" >/dev/null 2>&1; then SUPERUSER="$u"; break; fi
          done
          [[ -n "${SUPERUSER}" ]] || { echo "no usable superuser found" >&2; exit 1; }
          echo "superuser: ${SUPERUSER}"
          echo "-- databases --"; PSQL "${SUPERUSER}" "select datname from pg_database where not datistemplate"
          echo "-- roles --";     PSQL "${SUPERUSER}" "select rolname from pg_roles where rolcanlogin"

          NEW_PW="$(openssl rand -hex 24)"
          echo "::add-mask::${NEW_PW}"

          # aws-up.sh 런타임 기대값(user=service, db=service)으로 정렬
          PSQL "${SUPERUSER}" "do \$\$ begin if not exists (select from pg_roles where rolname='service') then create role service login superuser; end if; end \$\$;"
          PSQL "${SUPERUSER}" "alter user service with superuser password '${NEW_PW}'" >/dev/null
          if [[ "$(PSQL "${SUPERUSER}" "select count(*) from pg_database where datname='service'")" == "0" ]]; then
            PSQL "${SUPERUSER}" "create database service owner service"
          fi

          # k8s secret 을 같은 값으로 갱신 (다음 배포가 pgbouncer/DATABASE_URL 에 전파)
          kubectl --context "${MGMT_CLUSTER}" -n management create secret generic postgresql-secret \
            --from-literal=POSTGRES_USER=service \
            --from-literal=POSTGRES_PASSWORD="${NEW_PW}" \
            --from-literal=POSTGRES_DB=service \
            --dry-run=client -o yaml \
            | kubectl --context "${MGMT_CLUSTER}" apply -f - >/dev/null

          echo "password reset complete (value masked)"
