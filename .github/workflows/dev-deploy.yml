name: Dev Deploy

"on":
  workflow_run:
    workflows: [Dev Gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full dev SHA with a successful Dev Gate run
        required: true
        type: string
      deployment_scope:
        description: FULL deploys services and console; CONSOLE deploys only the console
        required: true
        default: FULL
        type: choice
        options:
          - FULL
          - CONSOLE
      previous_release_sha:
        description: Full SHA of the currently running release
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy gated dev SHA
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev' &&
       vars.AWS_DEV_DEPLOY_ENABLED == '1') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: dev-deploy
    env:
      AWS_REGION: ${{ vars.AWS_DEV_REGION }}
      ECR_REPOSITORY: ${{ vars.AWS_DEV_ECR_REPOSITORY }}
      CONSOLE_ECR_REPOSITORY: ${{ vars.AWS_DEV_CONSOLE_ECR_REPOSITORY }}
      EKS_CLUSTER: ${{ vars.AWS_DEV_EKS_CLUSTER }}
      BASE_URL: ${{ vars.AWS_DEV_BASE_URL }}
      AGENT_API_BASE_URL: ${{ vars.AGENT_API_BASE_URL }}
      MGMT_CONTEXT: opsia-dev
      MGMT_NS: management
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
      DEPLOYMENT_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_scope || 'FULL' }}
      PREVIOUS_RELEASE_SHA: ${{ inputs.previous_release_sha }}
      AUTH_EMAIL: admin
      AUTH_PASSWORD: ${{ secrets.AWS_DEV_AUTH_PASSWORD }}
      PROJECT_SLUG: kubernetes-ops
      SMOKE_CLUSTER_ID: ${{ secrets.AWS_DEV_SMOKE_CLUSTER_ID }}
      SMOKE_RCA_CORRELATION_ID: ${{ secrets.AWS_DEV_SMOKE_RCA_CORRELATION_ID }}
      SMOKE_RCA_INCIDENT_ID: ${{ secrets.AWS_DEV_SMOKE_RCA_INCIDENT_ID }}
      LLM_PROVIDER: ${{ vars.AWS_DEV_LLM_PROVIDER || 'openai' }}
      LLM_MODEL: ${{ vars.AWS_DEV_LLM_MODEL || 'gpt-4.1' }}
      LLM_API_KEY: ${{ secrets.AWS_DEV_LLM_API_KEY }}
    steps:
      - name: Check out gated dev SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download automatic deployment scope
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: dev-deploy-scope
          path: ${{ runner.temp }}/dev-deploy-scope
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Resolve automatic deployment scope
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          scope_file="${RUNNER_TEMP}/dev-deploy-scope/scope"
          test -f "${scope_file}"
          scope="$(tr -d '\r\n' <"${scope_file}")"
          case "${scope}" in
            FULL|CONSOLE) ;;
            *) echo "invalid automatic deployment scope" >&2; exit 1 ;;
          esac
          echo "DEPLOYMENT_SCOPE=${scope}" >>"${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deployment dependencies
        run: uv sync --frozen

      - name: Install authenticated browser smoke dependencies
        run: |
          npm ci --prefix frontend
          npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: Prepare approved upstream delta evidence
        run: make reference-upstream-prepare

      - name: Run incremental web patch governance
        run: make release-governance-web-patch

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.2

      - name: Validate non-secret deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          [[ "${AWS_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$ ]]
          [[ "${ECR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          [[ "${CONSOLE_ECR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          [[ "${EKS_CLUSTER}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$ ]]
          [[ "${BASE_URL}" =~ ^https://[^[:space:]]+$ ]]
          if [[ "${DEPLOYMENT_SCOPE}" == "FULL" ]]; then
            [[ "${AGENT_API_BASE_URL}" =~ ^https://[^/?#[:space:]]+/api$ ]]
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${PREVIOUS_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
            case "${DEPLOYMENT_SCOPE}" in
              FULL|CONSOLE) ;;
              *) echo "invalid deployment scope" >&2; exit 1 ;;
            esac
          fi

      - name: Verify manual gated SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_dev="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          comparison="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...${remote_dev}" \
            --jq '.status')"
          case "${comparison}" in
            "ahead"|"identical") ;;
            *) echo "source SHA is not an ancestor of dev: ${comparison}" >&2; exit 1 ;;
          esac
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/dev-gate.yml/runs?branch=dev&event=push&status=success&per_page=100" \
            | jq -e '.workflow_runs[] | select(.head_sha == env.SOURCE_SHA) | select(.conclusion == "success")' \
              >/dev/null

      - name: Configure AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEV_REGION }}

      - name: Build and push immutable service image
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${registry}"
          tagged_image="${registry}/${ECR_REPOSITORY}:${SOURCE_SHA}"
          docker build --file src/services/Dockerfile --tag "${tagged_image}" .
          docker push "${tagged_image}"
          digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${SOURCE_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${registry}/${ECR_REPOSITORY}@${digest}" >>"${GITHUB_OUTPUT}"

      - name: Build and push immutable console image
        id: console_image
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr describe-repositories --repository-names "${CONSOLE_ECR_REPOSITORY}" >/dev/null
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${registry}"
          tagged_image="${registry}/${CONSOLE_ECR_REPOSITORY}:${SOURCE_SHA}"
          docker build \
            --file frontend/Dockerfile \
            --build-arg "SOURCE_SHA=${SOURCE_SHA}" \
            --tag "${tagged_image}" \
            frontend
          docker push "${tagged_image}"
          digest="$(aws ecr describe-images \
            --repository-name "${CONSOLE_ECR_REPOSITORY}" \
            --image-ids "imageTag=${SOURCE_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${registry}/${CONSOLE_ECR_REPOSITORY}@${digest}" >>"${GITHUB_OUTPUT}"

      - name: Configure explicit dev cluster context
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER}" \
            --alias "${MGMT_CONTEXT}"
          test "$(kubectl config current-context)" = "${MGMT_CONTEXT}"

      - name: Ensure persistent management runtime secrets
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        run: |
          set -euo pipefail
          if ! kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get secret management-runtime-secret >/dev/null 2>&1; then
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              create secret generic management-runtime-secret >/dev/null
          fi

          ensure_runtime_secret_value() {
            local secret_key="$1"
            local minimum_length="$2"
            local encoded value patch
            encoded="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get secret management-runtime-secret \
              --output "jsonpath={.data.${secret_key}}")"
            value=""
            if [[ -n "${encoded}" ]]; then
              value="$(printf '%s' "${encoded}" | base64 --decode 2>/dev/null || true)"
            fi
            if (( ${#value} >= minimum_length )); then
              return
            fi
            value="$(openssl rand -hex 32)"
            encoded="$(printf '%s' "${value}" | base64 | tr -d '\n')"
            patch="$(jq -cn \
              --arg key "${secret_key}" \
              --arg value "${encoded}" \
              '{data:{($key):$value}}')"
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              patch secret management-runtime-secret --type merge --patch "${patch}" \
              >/dev/null
          }
          ensure_runtime_secret_value CREDENTIAL_ENCRYPTION_KEY 1
          ensure_runtime_secret_value FILTER_CURSOR_SIGNING_KEY 32

      - name: Render and verify auth bypass policy
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize deploy/management >"${RUNNER_TEMP}/management.yaml"
          uv run python scripts/verify_dev_auth_bypass.py rendered \
            --manifest "${RUNNER_TEMP}/management.yaml"

      - name: Run pre-deploy smoke
        id: pre_smoke
        shell: bash
        run: |
          set -euo pipefail
          result="$(bash scripts/pre-deploy-smoke.sh)"
          printf '%s\n' "${result}"
          frontend_bundle="${result#frontend_bundle=}"
          [[ "${frontend_bundle}" =~ ^index-[A-Za-z0-9_-]+\.js$ ]]
          echo "frontend_bundle=${frontend_bundle}" >>"${GITHUB_OUTPUT}"

      - name: Retire legacy console deployment
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            delete deployment/console service/console --ignore-not-found --wait=true

      - name: Capture current service digest rollback plan
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        id: service_capture
        shell: bash
        env:
          SERVICE_DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            previous_sha="${PREVIOUS_RELEASE_SHA}"
          else
            previous_sha="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get configmap opsia-deploy-status \
              -o jsonpath='{.data.dev_sha}')"
          fi
          [[ "${previous_sha}" =~ ^[0-9a-f]{40}$ ]]
          kubectl kustomize deploy/management \
            >"${RUNNER_TEMP}/management-rendered.yaml"
          uv run python scripts/capture_image_digests.py \
            --context "${MGMT_CONTEXT}" \
            --namespace "${MGMT_NS}" \
            --manifest "${RUNNER_TEMP}/management-rendered.yaml" \
            --managed-repository "${SERVICE_DEPLOY_IMAGE%@*}" \
            --previous-release-sha "${previous_sha}" \
            --output "${RUNNER_TEMP}/service-rollback-plan.json"

      - name: Capture current console digest rollback plan
        id: console_capture
        shell: bash
        env:
          CONSOLE_DEPLOY_IMAGE: ${{ steps.console_image.outputs.image }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            previous_sha="${PREVIOUS_RELEASE_SHA}"
          else
            previous_sha="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get configmap opsia-deploy-status \
              -o jsonpath='{.data.dev_sha}')"
          fi
          [[ "${previous_sha}" =~ ^[0-9a-f]{40}$ ]]
          uv run python scripts/capture_image_digests.py \
            --context "${MGMT_CONTEXT}" \
            --namespace "${MGMT_NS}" \
            --managed-repository "${CONSOLE_DEPLOY_IMAGE%@*}" \
            --previous-release-sha "${previous_sha}" \
            --output "${RUNNER_TEMP}/console-rollback-plan.json"

      - name: Enforce live auth bypass zero
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            set env deployment/api-gateway DEV_AUTH_BYPASS=0 CONSOLE_ORIGIN=http://console-dev.management.svc.cluster.local:80
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            rollout status deployment/api-gateway --timeout=300s
          uv run python scripts/verify_dev_auth_bypass.py live \
            --context "${MGMT_CONTEXT}" \
            --namespace "${MGMT_NS}"

      - name: Run fail-closed database migration
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          kubectl set image \
            --filename deploy/management/migration-job.yaml \
            migration="${DEPLOY_IMAGE}" \
            --local \
            --output yaml >"${RUNNER_TEMP}/migration-job.yaml"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            delete job management-database-migration --ignore-not-found --wait=true
          kubectl --context "${MGMT_CONTEXT}" apply \
            --filename "${RUNNER_TEMP}/migration-job.yaml"
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            succeeded="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get job management-database-migration \
              -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
            failed="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get job management-database-migration \
              -o jsonpath='{.status.failed}' 2>/dev/null || true)"
            if [[ "${succeeded}" == "1" ]]; then
              break
            fi
            if [[ -n "${failed}" && "${failed}" != "0" ]]; then
              kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
                logs job/management-database-migration --all-containers --tail=300 || true
              kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
                describe job management-database-migration || true
              exit 1
            fi
            sleep 2
          done
          if [[ "${succeeded:-}" != "1" ]]; then
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              logs job/management-database-migration --all-containers --tail=300 || true
            exit 1
          fi

      - name: Bootstrap fixed dev administrator
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          cleanup() {
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              delete job management-admin-bootstrap --ignore-not-found --wait=true >/dev/null 2>&1 || true
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              delete secret management-admin-bootstrap --ignore-not-found --wait=true >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            create secret generic management-admin-bootstrap \
            --from-literal="AUTH_PASSWORD=${AUTH_PASSWORD}" \
            --dry-run=client \
            --output yaml \
            | kubectl --context "${MGMT_CONTEXT}" apply --filename -
          kubectl set image \
            --filename deploy/management/admin-bootstrap-job.yaml \
            bootstrap="${DEPLOY_IMAGE}" \
            --local \
            --output yaml >"${RUNNER_TEMP}/admin-bootstrap-job.yaml"
          kubectl --context "${MGMT_CONTEXT}" apply \
            --filename "${RUNNER_TEMP}/admin-bootstrap-job.yaml"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            wait --for=condition=complete job/management-admin-bootstrap --timeout=300s

      - name: Synchronize fixed dev runtime identity
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        run: |
          set -euo pipefail
          admin_id="$(python3 - <<'PY'
          import os
          import uuid

          project_slug = os.environ["PROJECT_SLUG"].strip()
          identifier = os.environ["AUTH_EMAIL"].strip().lower()
          print("user-" + str(uuid.uuid5(uuid.NAMESPACE_URL, f"{project_slug}:{identifier}")))
          PY
          )"
          [[ "${admin_id}" =~ ^user-[0-9a-f-]{36}$ ]]
          echo "DEV_ADMIN_USER_ID=${admin_id}" >>"${GITHUB_ENV}"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            patch configmap management-runtime-config --type merge \
            --patch "{\"data\":{\"TRUSTED_PROXY_AUTH_USER_ID\":\"${admin_id}\",\"CONTROL_ALLOWED_NAMESPACES\":\"sandbox,color-turf\",\"POD_EXEC_ALLOWED_NAMESPACES\":\"sandbox,color-turf\",\"TARGET_DEFAULT_CONTROL_NAMESPACES\":\"sandbox,color-turf\"}}"

          if [[ -n "${LLM_API_KEY}" ]]; then
            llm_provider_encoded="$(printf '%s' "${LLM_PROVIDER}" | base64 | tr -d '\n')"
            llm_model_encoded="$(printf '%s' "${LLM_MODEL}" | base64 | tr -d '\n')"
            llm_key_encoded="$(printf '%s' "${LLM_API_KEY}" | base64 | tr -d '\n')"
            llm_patch="$(jq -cn \
              --arg provider "${llm_provider_encoded}" \
              --arg model "${llm_model_encoded}" \
              --arg key "${llm_key_encoded}" \
              '{data:{LLM_PROVIDER:$provider,LLM_MODEL:$model,LLM_API_KEY:$key}}')"
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              patch secret management-runtime-secret --type merge --patch "${llm_patch}" \
              >/dev/null
          fi
          unset admin_id llm_provider_encoded llm_model_encoded llm_key_encoded llm_patch

      - name: Seed dedicated dev demo workspace
        id: demo_seed
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_IMAGE}" =~ ^[A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "${DEV_ADMIN_USER_ID}" =~ ^user-[0-9a-f-]{36}$ ]]
          cleanup_demo_seed() {
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              delete job management-demo-workspace-seed \
              --ignore-not-found --wait=true >/dev/null 2>&1 || true
            rm -f -- \
              "${RUNNER_TEMP}/demo-workspace-seed-image.yaml" \
              "${RUNNER_TEMP}/demo-workspace-seed-job.yaml"
          }
          describe_demo_seed_failure() {
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              logs job/management-demo-workspace-seed \
              --all-containers --tail=500 || true
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              describe job management-demo-workspace-seed || true
          }
          trap cleanup_demo_seed EXIT
          cleanup_demo_seed
          kubectl set image \
            --filename deploy/management/demo-workspace-seed-job.yaml \
            seed="${DEPLOY_IMAGE}" \
            --local \
            --output yaml >"${RUNNER_TEMP}/demo-workspace-seed-image.yaml"
          kubectl set env \
            --filename "${RUNNER_TEMP}/demo-workspace-seed-image.yaml" \
            DEMO_WORKSPACE_OWNER_USER_ID="${DEV_ADMIN_USER_ID}" \
            --local \
            --output yaml >"${RUNNER_TEMP}/demo-workspace-seed-job.yaml"
          kubectl --context "${MGMT_CONTEXT}" apply \
            --filename "${RUNNER_TEMP}/demo-workspace-seed-job.yaml"
          seed_deadline=$((SECONDS + 330))
          while true; do
            seed_status="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get job management-demo-workspace-seed --output json)"
            if jq -e '
              .status.conditions[]?
              | select(.type == "Failed" and .status == "True")
            ' >/dev/null <<<"${seed_status}"; then
              echo "demo workspace seed job reported Failed=True" >&2
              describe_demo_seed_failure
              exit 1
            fi
            if jq -e '
              .status.conditions[]?
              | select(.type == "Complete" and .status == "True")
            ' >/dev/null <<<"${seed_status}"; then
              break
            fi
            if (( SECONDS >= seed_deadline )); then
              echo "timed out waiting 330 seconds for demo workspace seed job" >&2
              describe_demo_seed_failure
              exit 1
            fi
            sleep 2
          done
          unset seed_status seed_deadline
          seed_json="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            logs job/management-demo-workspace-seed --all-containers --tail=500)"
          printf '%s\n' "${seed_json}"
          demo_workspace_id="$(jq -er '
            if type == "object"
              and (.workspace_id | type == "string")
              and (.workspace_id | length > 0)
            then .workspace_id
            else error("seed workspace_id contract is invalid")
            end
          ' <<<"${seed_json}")"
          [[ "${demo_workspace_id}" =~ ^[A-Za-z0-9._-]+$ ]]
          printf 'workspace_id=%s\n' "${demo_workspace_id}" >>"${GITHUB_OUTPUT}"
          unset seed_json demo_workspace_id

      - name: Pin target agent image in runtime config
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          TARGET_AGENT_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          [[ "${TARGET_AGENT_IMAGE}" =~ ^[A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "${AGENT_API_BASE_URL}" =~ ^https://[^/?#[:space:]]+/api$ ]]
          gitops_image_before="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get configmap management-runtime-config \
            --output jsonpath='{.data.GITOPS_WEBHOOK_IMAGE}')"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            patch configmap management-runtime-config --type merge \
            --patch "{\"data\":{\"PUBLIC_MANAGEMENT_BASE_URL\":\"${AGENT_API_BASE_URL}\",\"TARGET_AGENT_IMAGE\":\"${TARGET_AGENT_IMAGE}\"}}"
          installed_management_base_url="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get configmap management-runtime-config \
            --output jsonpath='{.data.PUBLIC_MANAGEMENT_BASE_URL}')"
          installed_target_image="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get configmap management-runtime-config \
            --output jsonpath='{.data.TARGET_AGENT_IMAGE}')"
          gitops_image_after="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get configmap management-runtime-config \
            --output jsonpath='{.data.GITOPS_WEBHOOK_IMAGE}')"
          test "${installed_management_base_url}" = "${AGENT_API_BASE_URL}"
          test "${installed_target_image}" = "${TARGET_AGENT_IMAGE}"
          test "${gitops_image_after}" = "${gitops_image_before}"
          unset gitops_image_before gitops_image_after installed_management_base_url installed_target_image

      - name: Roll out immutable service digest
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          uv run python scripts/rollout_image_digest.py \
            --plan "${RUNNER_TEMP}/service-rollback-plan.json" \
            --manifest "${RUNNER_TEMP}/management-rendered.yaml" \
            --reconcile-existing-specs \
            --context "${MGMT_CONTEXT}" \
            --image "${DEPLOY_IMAGE}" \
            --timeout 600s

      - name: Roll out immutable console digest
        shell: bash
        env:
          CONSOLE_DEPLOY_IMAGE: ${{ steps.console_image.outputs.image }}
        run: |
          set -euo pipefail
          uv run python scripts/rollout_image_digest.py \
            --plan "${RUNNER_TEMP}/console-rollback-plan.json" \
            --context "${MGMT_CONTEXT}" \
            --image "${CONSOLE_DEPLOY_IMAGE}" \
            --timeout 600s

      - name: Verify live auth bypass policy after rollout
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/verify_dev_auth_bypass.py live \
            --context "${MGMT_CONTEXT}" \
            --namespace "${MGMT_NS}"

      - name: Run post-deploy smoke
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          PRE_DEPLOY_FRONTEND_BUNDLE: ${{ steps.pre_smoke.outputs.frontend_bundle }}
          REQUIRE_FRONTEND_BUNDLE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          EXPECTED_SERVICE_IMAGE: ${{ steps.image.outputs.image }}
          EXPECTED_CONSOLE_IMAGE: ${{ steps.console_image.outputs.image }}
          SERVICE_ROLLBACK_PLAN: ${{ runner.temp }}/service-rollback-plan.json
          CONSOLE_ROLLBACK_PLAN: ${{ runner.temp }}/console-rollback-plan.json
          AUTH_COOKIE_JAR_OUT: ${{ runner.temp }}/browser-auth-cookie.jar
        run: |
          set -euo pipefail
          EXPECTED_ALEMBIC_HEAD="$(uv run alembic heads | awk '{print $1}')"
          export EXPECTED_ALEMBIC_HEAD
          RUN_SMOKE=1 SMOKE_COMMIT_SHA="${SOURCE_SHA}" bash scripts/post-deploy-smoke.sh

      - name: Run post-deploy console smoke
        if: env.DEPLOYMENT_SCOPE == 'CONSOLE'
        shell: bash
        env:
          PRE_DEPLOY_FRONTEND_BUNDLE: ${{ steps.pre_smoke.outputs.frontend_bundle }}
          EXPECTED_CONSOLE_IMAGE: ${{ steps.console_image.outputs.image }}
          CONSOLE_ROLLBACK_PLAN: ${{ runner.temp }}/console-rollback-plan.json
        run: bash scripts/post-deploy-console-smoke.sh

      - name: Run authenticated browser route smoke
        id: browser_smoke
        env:
          AUTH_COOKIE_JAR: ${{ runner.temp }}/browser-auth-cookie.jar
          DEMO_WORKSPACE_ID: ${{ steps.demo_seed.outputs.workspace_id }}
          REQUIRE_DEMO_WORKSPACE_SMOKE: ${{ env.DEPLOYMENT_SCOPE == 'FULL' && '1' || '0' }}
          ROUTE_SMOKE_BASE_URL: http://127.0.0.1:18080
        shell: bash
        run: |
          set -euo pipefail
          forward_log="${RUNNER_TEMP}/console-route-smoke-port-forward.log"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            port-forward service/console-dev 18080:80 \
            --address=127.0.0.1 >"${forward_log}" 2>&1 &
          forward_pid=$!
          cleanup_route_smoke_forward() {
            kill "${forward_pid}" 2>/dev/null || true
            wait "${forward_pid}" 2>/dev/null || true
            rm -f -- "${forward_log}"
          }
          trap cleanup_route_smoke_forward EXIT

          ready=0
          for _attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --output /dev/null \
              "${ROUTE_SMOKE_BASE_URL}/"; then
              ready=1
              break
            fi
            if ! kill -0 "${forward_pid}" 2>/dev/null; then
              cat "${forward_log}" >&2
              exit 1
            fi
            sleep 0.25
          done
          if [[ "${ready}" != "1" ]]; then
            cat "${forward_log}" >&2
            echo "console route-smoke port-forward did not become ready" >&2
            exit 1
          fi

          BASE_URL="${ROUTE_SMOKE_BASE_URL}" npm --prefix frontend run smoke:routes

      - name: Capture service crash diagnostics
        if: failure() && steps.browser_smoke.outcome == 'failure' && env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        run: |
          set -uo pipefail
          redact_diagnostics() {
            uv run python scripts/redact_diagnostic_stream.py
          }

          pods_json="$(
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get pods --selector app=api-gateway --output json 2>/dev/null
          )" || pods_json='{"items":[]}'
          mapfile -t pod_rows < <(
            jq -r '.items[] | [.metadata.name, .metadata.uid] | @tsv' <<<"${pods_json}"
          )

          echo "::group::api-gateway rollout state"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get deployment api-gateway --output json 2>&1 \
            | jq -c '{
                metadata: {
                  name: .metadata.name,
                  generation: .metadata.generation,
                  observedGeneration: .status.observedGeneration
                },
                spec: {
                  replicas: .spec.replicas,
                  strategy: .spec.strategy
                },
                status: {
                  availableReplicas: .status.availableReplicas,
                  readyReplicas: .status.readyReplicas,
                  replicas: .status.replicas,
                  unavailableReplicas: .status.unavailableReplicas,
                  updatedReplicas: .status.updatedReplicas,
                  conditions: [
                    .status.conditions[]? | {
                      type,
                      status,
                      reason,
                      lastTransitionTime
                    }
                  ]
                }
              }' \
            | redact_diagnostics || true
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            rollout status deployment/api-gateway --timeout=5s 2>&1 \
            | redact_diagnostics || true
          echo "::endgroup::"

          if (( ${#pod_rows[@]} == 0 )); then
            echo "api-gateway diagnostics: no matching pods"
          fi

          for pod_row in "${pod_rows[@]}"; do
            IFS=$'\t' read -r pod_name pod_uid <<<"${pod_row}"
            [[ "${pod_name}" =~ ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$ ]] || continue
            [[ "${pod_uid}" =~ ^[0-9a-f-]{36}$ ]] || continue

            echo "::group::api-gateway pod ${pod_name} state"
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get pod "${pod_name}" --output json 2>&1 \
              | jq -c '{
                  metadata: {
                    name: .metadata.name,
                    uid: .metadata.uid,
                    creationTimestamp: .metadata.creationTimestamp
                  },
                  status: {
                    phase: .status.phase,
                    reason: (.status.reason // null),
                    containerStatuses: [
                      .status.containerStatuses[]? | {
                        name,
                        ready,
                        restartCount,
                        state: {
                          waiting: (
                            if .state.waiting
                            then {reason: .state.waiting.reason}
                            else null
                            end
                          ),
                          terminated: (
                            if .state.terminated
                            then {
                              reason: .state.terminated.reason,
                              exitCode: .state.terminated.exitCode,
                              signal: .state.terminated.signal,
                              startedAt: .state.terminated.startedAt,
                              finishedAt: .state.terminated.finishedAt
                            }
                            else null
                            end
                          ),
                          running: (
                            if .state.running
                            then {startedAt: .state.running.startedAt}
                            else null
                            end
                          )
                        },
                        lastState: {
                          terminated: (
                            if .lastState.terminated
                            then {
                              reason: .lastState.terminated.reason,
                              exitCode: .lastState.terminated.exitCode,
                              signal: .lastState.terminated.signal,
                              startedAt: .lastState.terminated.startedAt,
                              finishedAt: .lastState.terminated.finishedAt
                            }
                            else null
                            end
                          )
                        }
                      }
                    ]
                  }
                }' \
              | redact_diagnostics || true
            echo "::endgroup::"

            echo "::group::api-gateway pod ${pod_name} describe"
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              describe pod "${pod_name}" 2>&1 \
              | redact_diagnostics || true
            echo "::endgroup::"

            echo "::group::api-gateway pod ${pod_name} previous logs"
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              logs pod/"${pod_name}" --all-containers=true --previous \
              --tail=500 --timestamps=true 2>&1 \
              | redact_diagnostics || true
            echo "::endgroup::"

            echo "::group::api-gateway pod ${pod_name} current logs"
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              logs pod/"${pod_name}" --all-containers=true --tail=500 \
              --timestamps=true 2>&1 \
              | redact_diagnostics || true
            echo "::endgroup::"

            echo "::group::api-gateway pod ${pod_name} related events"
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get events \
              --field-selector "involvedObject.uid=${pod_uid}" \
              --sort-by=.lastTimestamp --output json 2>&1 \
              | jq -c '{
                  items: [
                    .items[]? | {
                      type,
                      reason,
                      message,
                      firstTimestamp,
                      lastTimestamp,
                      count,
                      source: .source.component
                    }
                  ]
                }' \
              | redact_diagnostics || true
            echo "::endgroup::"
          done
          unset pods_json pod_rows pod_row pod_name pod_uid

      - name: Remove browser authentication handoff
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/browser-auth-cookie.jar"

      - name: Upgrade existing target agent policies
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          kubectl set image \
            --filename deploy/management/target-policy-upgrade-job.yaml \
            upgrade="${DEPLOY_IMAGE}" \
            --local \
            --output yaml >"${RUNNER_TEMP}/target-policy-upgrade-job.yaml"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            delete job target-policy-upgrade --ignore-not-found --wait=true
          kubectl --context "${MGMT_CONTEXT}" apply \
            --filename "${RUNNER_TEMP}/target-policy-upgrade-job.yaml"
          if ! kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            wait --for=condition=complete job/target-policy-upgrade --timeout=300s; then
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              logs job/target-policy-upgrade --all-containers --tail=500 || true
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              describe job target-policy-upgrade || true
            exit 1
          fi
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            logs job/target-policy-upgrade --all-containers --tail=500

      - name: Record successful dev SHA in cluster
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        id: status
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            create configmap opsia-deploy-status \
            --from-literal="dev_sha=${SOURCE_SHA}" \
            --dry-run=client \
            --output yaml \
            | kubectl --context "${MGMT_CONTEXT}" apply --filename -

      - name: Record successful console SHA in cluster
        if: env.DEPLOYMENT_SCOPE == 'FULL' || env.DEPLOYMENT_SCOPE == 'CONSOLE'
        id: console_status
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            create configmap opsia-console-deploy-status \
            --from-literal="console_sha=${SOURCE_SHA}" \
            --dry-run=client \
            --output yaml \
            | kubectl --context "${MGMT_CONTEXT}" apply --filename -

      - name: Restore previous release after failure
        if: failure() && steps.console_capture.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          rollback_failed=0
          uv run python scripts/revert_image_digests.py \
            --plan "${RUNNER_TEMP}/console-rollback-plan.json" \
            --context "${MGMT_CONTEXT}" \
            --timeout 600s \
            --apply || rollback_failed=1
          if [[ "${DEPLOYMENT_SCOPE}" == "FULL" ]]; then
            uv run python scripts/revert_image_digests.py \
              --plan "${RUNNER_TEMP}/service-rollback-plan.json" \
              --context "${MGMT_CONTEXT}" \
              --timeout 600s \
              --apply || rollback_failed=1
          fi
          exit "${rollback_failed}"
