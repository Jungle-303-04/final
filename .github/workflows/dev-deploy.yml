name: Dev Deploy

"on":
  workflow_run:
    workflows: [Dev Gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full dev SHA with a successful Dev Gate run
        required: true
        type: string
      deployment_scope:
        description: FULL deploys services and console; CONSOLE deploys only the console
        required: true
        default: FULL
        type: choice
        options:
          - FULL
          - CONSOLE
      previous_release_sha:
        description: Full SHA of the currently running release
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy gated dev SHA
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev' &&
       vars.AWS_DEV_DEPLOY_ENABLED == '1') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: dev-deploy
    env:
      AWS_REGION: ${{ vars.AWS_DEV_REGION }}
      ECR_REPOSITORY: ${{ vars.AWS_DEV_ECR_REPOSITORY }}
      CONSOLE_ECR_REPOSITORY: ${{ vars.AWS_DEV_CONSOLE_ECR_REPOSITORY }}
      EKS_CLUSTER: ${{ vars.AWS_DEV_EKS_CLUSTER }}
      BASE_URL: ${{ vars.AWS_DEV_BASE_URL }}
      AGENT_API_BASE_URL: ${{ vars.AGENT_API_BASE_URL }}
      MGMT_CONTEXT: opsia-dev
      MGMT_NS: management
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
      DEPLOYMENT_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_scope || 'FULL' }}
      PREVIOUS_RELEASE_SHA: ${{ inputs.previous_release_sha }}
      AUTH_EMAIL: admin
      AUTH_PASSWORD: ${{ secrets.AWS_DEV_AUTH_PASSWORD }}
      PROJECT_SLUG: kubernetes-ops
      SMOKE_CLUSTER_ID: ${{ secrets.AWS_DEV_SMOKE_CLUSTER_ID }}
      SMOKE_RCA_CORRELATION_ID: ${{ secrets.AWS_DEV_SMOKE_RCA_CORRELATION_ID }}
      SMOKE_RCA_INCIDENT_ID: ${{ secrets.AWS_DEV_SMOKE_RCA_INCIDENT_ID }}
    steps:
      - name: Check out gated dev SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install deployment dependencies
        run: uv sync --frozen

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.2

      - name: Validate non-secret deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          [[ "${AWS_REGION}" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]$ ]]
          [[ "${ECR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          [[ "${CONSOLE_ECR_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
          [[ "${EKS_CLUSTER}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$ ]]
          [[ "${BASE_URL}" =~ ^https://[^[:space:]]+$ ]]
          if [[ "${DEPLOYMENT_SCOPE}" == "FULL" ]]; then
            [[ "${AGENT_API_BASE_URL}" =~ ^https://[^/?#[:space:]]+/api$ ]]
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${PREVIOUS_RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
            case "${DEPLOYMENT_SCOPE}" in
              FULL|CONSOLE) ;;
              *) echo "invalid deployment scope" >&2; exit 1 ;;
            esac
          fi

      - name: Verify manual gated SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_dev="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq '.object.sha')"
          comparison="$(gh api \
            "repos/${GITHUB_REPOSITORY}/compare/${SOURCE_SHA}...${remote_dev}" \
            --jq '.status')"
          case "${comparison}" in
            "ahead"|"identical") ;;
            *) echo "source SHA is not an ancestor of dev: ${comparison}" >&2; exit 1 ;;
          esac
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/dev-gate.yml/runs?branch=dev&event=push&status=success&per_page=100" \
            | jq -e '.workflow_runs[] | select(.head_sha == env.SOURCE_SHA) | select(.conclusion == "success")' \
              >/dev/null

      - name: Configure AWS identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEV_REGION }}

      - name: Build and push immutable service image
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr describe-repositories --repository-names "${ECR_REPOSITORY}" >/dev/null
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${registry}"
          tagged_image="${registry}/${ECR_REPOSITORY}:${SOURCE_SHA}"
          docker build --file src/services/Dockerfile --tag "${tagged_image}" .
          docker push "${tagged_image}"
          digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${SOURCE_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${registry}/${ECR_REPOSITORY}@${digest}" >>"${GITHUB_OUTPUT}"

      - name: Build and push immutable console image
        id: console_image
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr describe-repositories --repository-names "${CONSOLE_ECR_REPOSITORY}" >/dev/null
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin "${registry}"
          tagged_image="${registry}/${CONSOLE_ECR_REPOSITORY}:${SOURCE_SHA}"
          docker build \
            --file frontend/Dockerfile \
            --build-arg "SOURCE_SHA=${SOURCE_SHA}" \
            --tag "${tagged_image}" \
            frontend
          docker push "${tagged_image}"
          digest="$(aws ecr describe-images \
            --repository-name "${CONSOLE_ECR_REPOSITORY}" \
            --image-ids "imageTag=${SOURCE_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${registry}/${CONSOLE_ECR_REPOSITORY}@${digest}" >>"${GITHUB_OUTPUT}"

      - name: Configure explicit dev cluster context
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER}" \
            --alias "${MGMT_CONTEXT}"
          test "$(kubectl config current-context)" = "${MGMT_CONTEXT}"

      - name: Render and verify auth bypass policy
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize deploy/management >"${RUNNER_TEMP}/management.yaml"
          uv run python scripts/verify_dev_auth_bypass.py rendered \
            --manifest "${RUNNER_TEMP}/management.yaml"

      - name: Run pre-deploy smoke
        id: pre_smoke
        shell: bash
        run: |
          set -euo pipefail
          result="$(bash scripts/pre-deploy-smoke.sh)"
          printf '%s\n' "${result}"
          frontend_bundle="${result#frontend_bundle=}"
          [[ "${frontend_bundle}" =~ ^index-[A-Za-z0-9_-]+\.js$ ]]
          echo "frontend_bundle=${frontend_bundle}" >>"${GITHUB_OUTPUT}"

      - name: Retire legacy console deployment
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            delete deployment/console service/console --ignore-not-found --wait=true

      - name: Capture current service digest rollback plan
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        id: service_capture
        shell: bash
        env:
          SERVICE_DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            previous_sha="${PREVIOUS_RELEASE_SHA}"
          else
            previous_sha="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get configmap opsia-deploy-status \
              -o jsonpath='{.data.dev_sha}')"
          fi
          [[ "${previous_sha}" =~ ^[0-9a-f]{40}$ ]]
          uv run python scripts/capture_image_digests.py \
            --context "${MGMT_CONTEXT}" \
            --namespace "${MGMT_NS}" \
            --managed-repository "${SERVICE_DEPLOY_IMAGE%@*}" \
            --previous-release-sha "${previous_sha}" \
            --output "${RUNNER_TEMP}/service-rollback-plan.json"

      - name: Capture current console digest rollback plan
        id: console_capture
        shell: bash
        env:
          CONSOLE_DEPLOY_IMAGE: ${{ steps.console_image.outputs.image }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            previous_sha="${PREVIOUS_RELEASE_SHA}"
          else
            previous_sha="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              get configmap opsia-deploy-status \
              -o jsonpath='{.data.dev_sha}')"
          fi
          [[ "${previous_sha}" =~ ^[0-9a-f]{40}$ ]]
          uv run python scripts/capture_image_digests.py \
            --context "${MGMT_CONTEXT}" \
            --namespace "${MGMT_NS}" \
            --managed-repository "${CONSOLE_DEPLOY_IMAGE%@*}" \
            --previous-release-sha "${previous_sha}" \
            --output "${RUNNER_TEMP}/console-rollback-plan.json"

      - name: Enforce live auth bypass zero
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            set env deployment/api-gateway DEV_AUTH_BYPASS=0 CONSOLE_ORIGIN=http://console-dev.management.svc.cluster.local:80
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            rollout status deployment/api-gateway --timeout=300s
          uv run python scripts/verify_dev_auth_bypass.py live \
            --context "${MGMT_CONTEXT}" \
            --namespace "${MGMT_NS}"

      - name: Run fail-closed database migration
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          kubectl set image \
            --filename deploy/management/migration-job.yaml \
            migration="${DEPLOY_IMAGE}" \
            --local \
            --output yaml >"${RUNNER_TEMP}/migration-job.yaml"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            delete job management-database-migration --ignore-not-found --wait=true
          kubectl --context "${MGMT_CONTEXT}" apply \
            --filename "${RUNNER_TEMP}/migration-job.yaml"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            wait --for=condition=complete job/management-database-migration --timeout=900s

      - name: Bootstrap fixed dev administrator
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          cleanup() {
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              delete job management-admin-bootstrap --ignore-not-found --wait=true >/dev/null 2>&1 || true
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              delete secret management-admin-bootstrap --ignore-not-found --wait=true >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            create secret generic management-admin-bootstrap \
            --from-literal="AUTH_PASSWORD=${AUTH_PASSWORD}" \
            --dry-run=client \
            --output yaml \
            | kubectl --context "${MGMT_CONTEXT}" apply --filename -
          kubectl set image \
            --filename deploy/management/admin-bootstrap-job.yaml \
            bootstrap="${DEPLOY_IMAGE}" \
            --local \
            --output yaml >"${RUNNER_TEMP}/admin-bootstrap-job.yaml"
          kubectl --context "${MGMT_CONTEXT}" apply \
            --filename "${RUNNER_TEMP}/admin-bootstrap-job.yaml"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            wait --for=condition=complete job/management-admin-bootstrap --timeout=300s

      - name: Synchronize fixed dev runtime identity
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        run: |
          set -euo pipefail
          admin_id="$(python3 - <<'PY'
          import os
          import uuid

          project_slug = os.environ["PROJECT_SLUG"].strip()
          identifier = os.environ["AUTH_EMAIL"].strip().lower()
          print("user-" + str(uuid.uuid5(uuid.NAMESPACE_URL, f"{project_slug}:{identifier}")))
          PY
          )"
          [[ "${admin_id}" =~ ^user-[0-9a-f-]{36}$ ]]
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            patch configmap management-runtime-config --type merge \
            --patch "{\"data\":{\"TRUSTED_PROXY_AUTH_USER_ID\":\"${admin_id}\"}}"

          cursor_encoded="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get secret management-runtime-secret \
            --output jsonpath='{.data.FILTER_CURSOR_SIGNING_KEY}')"
          cursor_value=""
          if [[ -n "${cursor_encoded}" ]]; then
            cursor_value="$(printf '%s' "${cursor_encoded}" | base64 --decode 2>/dev/null || true)"
          fi
          if (( ${#cursor_value} < 32 )); then
            cursor_value="$(openssl rand -hex 32)"
            cursor_encoded="$(printf '%s' "${cursor_value}" | base64 | tr -d '\n')"
            kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
              patch secret management-runtime-secret --type merge \
              --patch "{\"data\":{\"FILTER_CURSOR_SIGNING_KEY\":\"${cursor_encoded}\"}}" \
              >/dev/null
          fi
          unset admin_id cursor_encoded cursor_value

      - name: Pin target agent image in runtime config
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          TARGET_AGENT_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          [[ "${TARGET_AGENT_IMAGE}" =~ ^[A-Za-z0-9._:/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "${AGENT_API_BASE_URL}" =~ ^https://[^/?#[:space:]]+/api$ ]]
          gitops_image_before="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get configmap management-runtime-config \
            --output jsonpath='{.data.GITOPS_WEBHOOK_IMAGE}')"
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            patch configmap management-runtime-config --type merge \
            --patch "{\"data\":{\"PUBLIC_MANAGEMENT_BASE_URL\":\"${AGENT_API_BASE_URL}\",\"TARGET_AGENT_IMAGE\":\"${TARGET_AGENT_IMAGE}\"}}"
          installed_management_base_url="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get configmap management-runtime-config \
            --output jsonpath='{.data.PUBLIC_MANAGEMENT_BASE_URL}')"
          installed_target_image="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get configmap management-runtime-config \
            --output jsonpath='{.data.TARGET_AGENT_IMAGE}')"
          gitops_image_after="$(kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            get configmap management-runtime-config \
            --output jsonpath='{.data.GITOPS_WEBHOOK_IMAGE}')"
          test "${installed_management_base_url}" = "${AGENT_API_BASE_URL}"
          test "${installed_target_image}" = "${TARGET_AGENT_IMAGE}"
          test "${gitops_image_after}" = "${gitops_image_before}"
          unset gitops_image_before gitops_image_after installed_management_base_url installed_target_image

      - name: Roll out immutable service digest
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          uv run python scripts/rollout_image_digest.py \
            --plan "${RUNNER_TEMP}/service-rollback-plan.json" \
            --context "${MGMT_CONTEXT}" \
            --image "${DEPLOY_IMAGE}" \
            --timeout 600s

      - name: Roll out immutable console digest
        shell: bash
        env:
          CONSOLE_DEPLOY_IMAGE: ${{ steps.console_image.outputs.image }}
        run: |
          set -euo pipefail
          uv run python scripts/rollout_image_digest.py \
            --plan "${RUNNER_TEMP}/console-rollback-plan.json" \
            --context "${MGMT_CONTEXT}" \
            --image "${CONSOLE_DEPLOY_IMAGE}" \
            --timeout 600s

      - name: Verify live auth bypass policy after rollout
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/verify_dev_auth_bypass.py live \
            --context "${MGMT_CONTEXT}" \
            --namespace "${MGMT_NS}"

      - name: Run post-deploy smoke
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        shell: bash
        env:
          PRE_DEPLOY_FRONTEND_BUNDLE: ${{ steps.pre_smoke.outputs.frontend_bundle }}
          REQUIRE_FRONTEND_BUNDLE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          EXPECTED_SERVICE_IMAGE: ${{ steps.image.outputs.image }}
          EXPECTED_CONSOLE_IMAGE: ${{ steps.console_image.outputs.image }}
          SERVICE_ROLLBACK_PLAN: ${{ runner.temp }}/service-rollback-plan.json
          CONSOLE_ROLLBACK_PLAN: ${{ runner.temp }}/console-rollback-plan.json
        run: |
          set -euo pipefail
          export EXPECTED_ALEMBIC_HEAD="$(uv run alembic heads | awk '{print $1}')"
          RUN_SMOKE=1 SMOKE_COMMIT_SHA="${SOURCE_SHA}" bash scripts/post-deploy-smoke.sh

      - name: Run post-deploy console smoke
        if: env.DEPLOYMENT_SCOPE == 'CONSOLE'
        shell: bash
        env:
          PRE_DEPLOY_FRONTEND_BUNDLE: ${{ steps.pre_smoke.outputs.frontend_bundle }}
          EXPECTED_CONSOLE_IMAGE: ${{ steps.console_image.outputs.image }}
          CONSOLE_ROLLBACK_PLAN: ${{ runner.temp }}/console-rollback-plan.json
        run: bash scripts/post-deploy-console-smoke.sh

      - name: Record successful dev SHA in cluster
        if: env.DEPLOYMENT_SCOPE == 'FULL'
        id: status
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            create configmap opsia-deploy-status \
            --from-literal="dev_sha=${SOURCE_SHA}" \
            --dry-run=client \
            --output yaml \
            | kubectl --context "${MGMT_CONTEXT}" apply --filename -

      - name: Record successful console SHA in cluster
        if: env.DEPLOYMENT_SCOPE == 'CONSOLE'
        id: console_status
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context "${MGMT_CONTEXT}" -n "${MGMT_NS}" \
            create configmap opsia-console-deploy-status \
            --from-literal="console_sha=${SOURCE_SHA}" \
            --dry-run=client \
            --output yaml \
            | kubectl --context "${MGMT_CONTEXT}" apply --filename -

      - name: Restore previous release after failure
        if: failure() && steps.console_capture.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          rollback_failed=0
          uv run python scripts/revert_image_digests.py \
            --plan "${RUNNER_TEMP}/console-rollback-plan.json" \
            --context "${MGMT_CONTEXT}" \
            --timeout 600s \
            --apply || rollback_failed=1
          if [[ "${DEPLOYMENT_SCOPE}" == "FULL" ]]; then
            uv run python scripts/revert_image_digests.py \
              --plan "${RUNNER_TEMP}/service-rollback-plan.json" \
              --context "${MGMT_CONTEXT}" \
              --timeout 600s \
              --apply || rollback_failed=1
          fi
          exit "${rollback_failed}"
