name: Dev Gate

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare bounded commit message range
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits || 0 }}
          PUSH_COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            COMMIT_COUNT="$(jq 'length' <<<"${PUSH_COMMITS}")"
          fi
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=2 origin "${GITHUB_SHA}"
            BASE_SHA="$(git rev-parse HEAD^)"
            COMMIT_COUNT=1
          else
            git fetch --no-tags --depth="$((COMMIT_COUNT + 1))" origin "${GITHUB_SHA}"
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git update-ref refs/remotes/origin/dev "${BASE_SHA}"

      - name: Enforce commit message convention
        run: scripts/commit-msg-gate.sh --range origin/dev..HEAD

      - name: Classify automatic deployment scope
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dev-deploy-scope"
          scripts/classify-deploy-scope.sh origin/dev HEAD \
            >"${RUNNER_TEMP}/dev-deploy-scope/scope"

      - name: Upload automatic deployment scope
        uses: actions/upload-artifact@v4
        with:
          name: dev-deploy-scope
          path: ${{ runner.temp }}/dev-deploy-scope/scope
          if-no-files-found: error
          retention-days: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Verify commit message gate rules
        run: uv run pytest -q tests/test_commit_msg_gate.py

      - name: Run canonical gate
        run: make gate
