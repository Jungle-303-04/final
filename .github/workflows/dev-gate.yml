name: Dev Gate

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    name: Commit and deployment proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gate_scope: ${{ steps.gate-scope.outputs.scope }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # pull_request의 기본 checkout은 GitHub가 만든 synthetic merge SHA다.
          # 제목 게이트는 실제 PR 커밋만 검사하고, push는 그대로 gated SHA를 검사한다.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare bounded commit message range
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits || 0 }}
          PUSH_COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            COMMIT_COUNT="$(jq 'length' <<<"${PUSH_COMMITS}")"
          fi
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=2 origin "${AUDIT_HEAD_SHA}"
            BASE_SHA="$(git rev-parse HEAD^)"
            COMMIT_COUNT=1
          else
            git fetch --no-tags --depth="$((COMMIT_COUNT + 1))" origin "${AUDIT_HEAD_SHA}"
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git update-ref refs/remotes/origin/dev "${BASE_SHA}"

      - name: Enforce commit message convention
        run: scripts/commit-msg-gate.sh --range origin/dev..HEAD

      - name: Resolve gate scope
        id: gate-scope
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          scope="FULL"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            scope="$(scripts/verify-merged-pr-gate.sh "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          if [[ "${scope}" != "REUSE" ]] \
            && [[ -n "${BASE_SHA}" ]] \
            && ! [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            scope="$(scripts/classify-dev-gate-scope.sh "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          case "${scope}" in
            REUSE|FULL|BACKEND|FRONTEND|SMOKE|DOCS) ;;
            *)
              echo "Unknown gate scope ${scope}; retaining FULL gate scope." >&2
              scope="FULL"
              ;;
          esac
          echo "scope=${scope}" >>"${GITHUB_OUTPUT}"
          echo "Dev Gate scope: ${scope}"

      - name: Set up Node.js for operational docs governance
        if: ${{ steps.gate-scope.outputs.scope == 'DOCS' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run operational docs governance
        if: ${{ steps.gate-scope.outputs.scope == 'DOCS' }}
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${HEAD_SHA}" -- \
            docs/BLOCKERS.md docs/GOAL-LOG.md docs/STATUS-REPORT.md
          node scripts/verify-product-brand-boundary.mjs

      - name: Classify automatic deployment scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dev-deploy-scope"
          scripts/classify-live-deploy-scope.sh HEAD \
            >"${RUNNER_TEMP}/dev-deploy-scope/scope"

      - name: Upload automatic deployment scope
        uses: actions/upload-artifact@v4
        with:
          name: dev-deploy-scope
          path: ${{ runner.temp }}/dev-deploy-scope/scope
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend and manifest gate
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        if: ${{ needs.source-proof.outputs.gate_scope != 'REUSE' && needs.source-proof.outputs.gate_scope != 'DOCS' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reuse pull request backend gate
        if: ${{ needs.source-proof.outputs.gate_scope == 'REUSE' }}
        run: echo "Reusing the exact successful pull request backend gate."

      - name: Record operational docs backend skip
        if: ${{ needs.source-proof.outputs.gate_scope == 'DOCS' }}
        run: echo "Operational report-only change; backend product gate is not applicable."

      - name: Set up Python
        if: ${{ needs.source-proof.outputs.gate_scope != 'REUSE' && needs.source-proof.outputs.gate_scope != 'DOCS' }}
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        if: ${{ needs.source-proof.outputs.gate_scope != 'REUSE' && needs.source-proof.outputs.gate_scope != 'DOCS' }}
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        if: ${{ needs.source-proof.outputs.gate_scope == 'FULL' || needs.source-proof.outputs.gate_scope == 'BACKEND' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Helm
        if: ${{ needs.source-proof.outputs.gate_scope == 'FULL' || needs.source-proof.outputs.gate_scope == 'BACKEND' }}
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2

      - name: Install Python dependencies
        if: ${{ needs.source-proof.outputs.gate_scope != 'REUSE' && needs.source-proof.outputs.gate_scope != 'DOCS' }}
        run: uv sync --frozen

      - name: Run contract and manifest gate
        if: ${{ needs.source-proof.outputs.gate_scope == 'FRONTEND' }}
        run: make gate-contract-manifest

      - name: Run deployment smoke backend gate
        if: ${{ needs.source-proof.outputs.gate_scope == 'SMOKE' }}
        run: make gate-deploy-smoke-backend

      - name: Run backend and manifest gate
        if: ${{ needs.source-proof.outputs.gate_scope == 'FULL' || needs.source-proof.outputs.gate_scope == 'BACKEND' }}
        run: make gate-backend

  frontend:
    name: Frontend gate
    needs: source-proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        if: ${{ needs.source-proof.outputs.gate_scope != 'REUSE' && needs.source-proof.outputs.gate_scope != 'DOCS' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reuse pull request frontend gate
        if: ${{ needs.source-proof.outputs.gate_scope == 'REUSE' }}
        run: echo "Reusing the exact successful pull request frontend gate."

      - name: Record operational docs frontend skip
        if: ${{ needs.source-proof.outputs.gate_scope == 'DOCS' }}
        run: echo "Operational report-only change; frontend product gate is not applicable."

      - name: Set up Node.js
        if: ${{ needs.source-proof.outputs.gate_scope != 'BACKEND' && needs.source-proof.outputs.gate_scope != 'REUSE' && needs.source-proof.outputs.gate_scope != 'DOCS' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend browser test runtime
        if: ${{ needs.source-proof.outputs.gate_scope != 'BACKEND' && needs.source-proof.outputs.gate_scope != 'REUSE' && needs.source-proof.outputs.gate_scope != 'DOCS' }}
        working-directory: frontend
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm exec playwright install --with-deps chromium

      - name: Record frontend full-gate skip
        if: ${{ needs.source-proof.outputs.gate_scope == 'BACKEND' }}
        run: echo "Backend-only change; contract and manifest coverage remains in the backend gate."

      - name: Fetch changed frontend base
        if: ${{ needs.source-proof.outputs.gate_scope == 'FRONTEND' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          test -n "${BASE_SHA}"
          [[ ! "${BASE_SHA}" =~ ^0+$ ]]
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Run changed frontend gate
        if: ${{ needs.source-proof.outputs.gate_scope == 'FRONTEND' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: GATE_BASE="${BASE_SHA}" make gate-frontend-changed

      - name: Run deployment smoke frontend gate
        if: ${{ needs.source-proof.outputs.gate_scope == 'SMOKE' }}
        run: make gate-deploy-smoke-frontend

      - name: Run frontend gate
        if: ${{ needs.source-proof.outputs.gate_scope == 'FULL' }}
        run: make gate-frontend

  gate:
    name: Full gate
    if: ${{ always() }}
    needs: [source-proof, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every parallel gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.source-proof.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"

      - name: Summarize gate results
        shell: bash
        run: |
          {
            echo "### Dev Gate"
            echo "| 검사 | 결과 |"
            echo "| --- | --- |"
            echo "| 소스/배포 증거 | ${{ needs.source-proof.result }} |"
            echo "| 백엔드 | ${{ needs.backend.result }} |"
            echo "| 프런트엔드 | ${{ needs.frontend.result }} |"
          } >>"${GITHUB_STEP_SUMMARY}"
