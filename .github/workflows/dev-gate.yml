name: Dev Gate

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dev-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    name: Commit and deployment proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # pull_request의 기본 checkout은 GitHub가 만든 synthetic merge SHA다.
          # 제목 게이트는 실제 PR 커밋만 검사하고, push는 그대로 gated SHA를 검사한다.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prepare bounded commit message range
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          AUDIT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMIT_COUNT: ${{ github.event.pull_request.commits || 0 }}
          PUSH_COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            COMMIT_COUNT="$(jq 'length' <<<"${PUSH_COMMITS}")"
          fi
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=2 origin "${AUDIT_HEAD_SHA}"
            BASE_SHA="$(git rev-parse HEAD^)"
            COMMIT_COUNT=1
          else
            git fetch --no-tags --depth="$((COMMIT_COUNT + 1))" origin "${AUDIT_HEAD_SHA}"
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git update-ref refs/remotes/origin/dev "${BASE_SHA}"

      - name: Enforce commit message convention
        run: scripts/commit-msg-gate.sh --range origin/dev..HEAD

      - name: Classify automatic deployment scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/dev-deploy-scope"
          scripts/classify-live-deploy-scope.sh HEAD \
            >"${RUNNER_TEMP}/dev-deploy-scope/scope"

      - name: Upload automatic deployment scope
        uses: actions/upload-artifact@v4
        with:
          name: dev-deploy-scope
          path: ${{ runner.temp }}/dev-deploy-scope/scope
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend and manifest gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.2

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Verify commit message gate rules
        run: uv run pytest -q tests/test_commit_msg_gate.py

      - name: Run backend and manifest gate
        run: make gate-backend

  frontend:
    name: Frontend gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend gate
        run: make gate-frontend

  gate:
    name: Full gate
    if: ${{ always() }}
    needs: [source-proof, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every parallel gate
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.source-proof.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
