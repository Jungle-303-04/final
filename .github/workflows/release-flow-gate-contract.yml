name: Release Flow Gate Contract

"on":
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/validate_release_flow_production_gate.py"
      - "tests/test_release_flow_gate_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_release_flow_gate_contract:
    name: Validate production deploy gate contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pyyaml pytest

      - name: Validate workflow gate contract
        run: python scripts/validate_release_flow_production_gate.py .github/workflows

      - name: Run gate contract tests
        run: python -m pytest -q tests/test_release_flow_gate_contract.py tests/test_release_flow_production_gate_workflow.py tests/test_release_flow_smoke_workflow.py
