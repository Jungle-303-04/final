name: AWS CD

on:
  workflow_dispatch:
    inputs:
      create_clusters:
        description: Create EKS clusters if they are missing
        required: false
        type: boolean
        default: false
      ensure_ebs_csi:
        description: Ensure EBS CSI add-on and gp3 StorageClass
        required: false
        type: boolean
        default: false
      bootstrap_admin:
        description: Bootstrap/update the admin account from AUTH_* secrets
        required: false
        type: boolean
        default: false
      register_targets:
        description: Re-register target clusters with the new image
        required: false
        type: boolean
        default: false
      run_smoke:
        description: Run scripts/smoke.sh after deployment
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-cd-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        run: bash scripts/test.sh

  deploy:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'main' && vars.AWS_AUTO_DEPLOY != '0') }}
    environment: aws-test
    env:
      PROJECT_SLUG: ${{ vars.PROJECT_SLUG || 'kubeheal' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      MGMT_CLUSTER: ${{ vars.MGMT_CLUSTER || 'kubeheal-mgmt' }}
      TARGET_CLUSTER_1: ${{ vars.TARGET_CLUSTER_1 || 'kubeheal-target-a' }}
      TARGET_CLUSTER_2: ${{ vars.TARGET_CLUSTER_2 || 'kubeheal-target-b' }}
      TARGET_CLUSTER_ID_1: ${{ vars.TARGET_CLUSTER_ID_1 || vars.TARGET_CLUSTER_1 || 'kubeheal-target-a' }}
      TARGET_CLUSTER_ID_2: ${{ vars.TARGET_CLUSTER_ID_2 || vars.TARGET_CLUSTER_2 || 'kubeheal-target-b' }}
      SMOKE_CLUSTER_ID: ${{ vars.SMOKE_CLUSTER_ID || vars.TARGET_CLUSTER_ID_1 || vars.TARGET_CLUSTER_1 || 'kubeheal-target-a' }}
      MGMT_DISPLAY_NAME: ${{ vars.MGMT_DISPLAY_NAME || vars.MGMT_CLUSTER || 'KubeHeal Management' }}
      TARGET_1_DISPLAY_NAME: ${{ vars.TARGET_1_DISPLAY_NAME || vars.TARGET_CLUSTER_1 || 'KubeHeal Target A' }}
      TARGET_2_DISPLAY_NAME: ${{ vars.TARGET_2_DISPLAY_NAME || vars.TARGET_CLUSTER_2 || 'KubeHeal Target B' }}
      ECR_REPO: ${{ vars.ECR_REPO || 'kubeheal-service' }}
      IMAGE_TAG: ${{ github.sha }}
      GITHUB_REPO: ${{ vars.GITHUB_REPO || github.repository }}
      GITHUB_BRANCH: ${{ vars.GITHUB_BRANCH || github.ref_name }}
      MANIFEST_PATH: ${{ vars.MANIFEST_PATH }}
      SMOKE_MANIFEST_PATH: ${{ vars.SMOKE_MANIFEST_PATH || 'src/samples/smoke/deploy.yaml' }}
      GIT_MANIFEST_SOURCE_MODE: ${{ vars.GIT_MANIFEST_SOURCE_MODE || 'remote' }}
      GIT_LOCAL_MANIFEST_ENABLED: ${{ vars.GIT_LOCAL_MANIFEST_ENABLED || '0' }}
      GIT_CHECKOUT_CACHE_ENABLED: ${{ vars.GIT_CHECKOUT_CACHE_ENABLED || '1' }}
      GIT_CHECKOUT_CACHE_REQUIRED: ${{ vars.GIT_CHECKOUT_CACHE_REQUIRED || '0' }}
      GIT_CACHE_MAX_REPOS: ${{ vars.GIT_CACHE_MAX_REPOS || '8' }}
      GIT_CACHE_MAX_BYTES: ${{ vars.GIT_CACHE_MAX_BYTES || '1073741824' }}
      GITOPS_REQUIRE_APPROVED_SNAPSHOT: ${{ vars.GITOPS_REQUIRE_APPROVED_SNAPSHOT || '1' }}
      COMMAND_JANITOR_INTERVAL_SECONDS: ${{ vars.COMMAND_JANITOR_INTERVAL_SECONDS || '15' }}
      CREATE_CLUSTERS: ${{ github.event.inputs.create_clusters == 'true' && '1' || vars.AWS_CREATE_CLUSTERS || '0' }}
      ENSURE_EBS_CSI: ${{ github.event.inputs.ensure_ebs_csi == 'true' && '1' || vars.AWS_ENSURE_EBS_CSI || '0' }}
      BOOTSTRAP_ADMIN: ${{ github.event.inputs.bootstrap_admin == 'true' && '1' || vars.AWS_BOOTSTRAP_ADMIN || '0' }}
      REGISTER_TARGETS: ${{ github.event.inputs.register_targets == 'true' && '1' || vars.AWS_REGISTER_TARGETS || '0' }}
      RUN_SMOKE: ${{ github.event.inputs.run_smoke == 'true' && '1' || vars.AWS_RUN_SMOKE || '0' }}
      SKIP_LB_HEALTH_WAIT: ${{ vars.SKIP_LB_HEALTH_WAIT || '0' }}
      DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}
      CONFIGURE_ROUTE53: ${{ vars.CONFIGURE_ROUTE53 || '0' }}
      CONFIGURE_CLOUDFLARE: ${{ vars.CONFIGURE_CLOUDFLARE || '0' }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      ROUTE53_ZONE_NAME: ${{ vars.ROUTE53_ZONE_NAME }}
      CLOUDFLARE_ZONE_NAME: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_PROXIED: ${{ vars.CLOUDFLARE_PROXIED || '1' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTH_EMAIL: ${{ secrets.AUTH_EMAIL }}
      AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GH_APP_TOKEN || github.token }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
      OPENAI_COMPATIBLE_BASE_URL: ${{ vars.OPENAI_COMPATIBLE_BASE_URL }}
      OPENAI_COMPATIBLE_MODEL: ${{ vars.OPENAI_COMPATIBLE_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_BASE_URL: ${{ vars.GEMINI_BASE_URL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Install eksctl when cluster management is enabled
        if: env.CREATE_CLUSTERS == '1' || env.ENSURE_EBS_CSI == '1'
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" \
            | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin/eksctl
          eksctl version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: bash scripts/aws-up.sh

      - name: Dump management state on failure
        if: failure()
        run: |
          kubectl --context "${MGMT_CLUSTER}" -n management get pods -o wide || true
          kubectl --context "${MGMT_CLUSTER}" -n management logs deploy/api-gateway || true
