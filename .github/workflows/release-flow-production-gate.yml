name: Release Flow Production Gate
run-name: Release Flow Gate / ${{ inputs.github_environment || 'production' }} / ${{ inputs.release_plan_id || 'all-plans' }}

"on":
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API base URL. Falls back to RELEASE_FLOW_API_BASE_URL secret.
        required: false
        type: string
      release_plan_id:
        description: Optional release plan id to scope the production gate.
        required: false
        type: string
      production_preflight_run_limit:
        description: Maximum release runs to inspect for each guardrail.
        required: false
        default: "20"
        type: string
      request_timeout_seconds:
        description: Per-request API timeout for the release-flow smoke script.
        required: false
        default: "15"
        type: string
      retry_attempts:
        description: Retry attempts for safe read-only smoke requests.
        required: false
        default: "5"
        type: string
      retry_delay_seconds:
        description: Delay between retry attempts for safe read-only smoke requests.
        required: false
        default: "2"
        type: string
      github_environment:
        description: GitHub Environment that protects the production gate.
        required: false
        default: production
        type: string
      artifact_retention_days:
        description: Number of days to keep release-flow smoke artifacts.
        required: false
        default: "30"
        type: string
      alert_preflight:
        description: Send a validation alert through enabled alert channels.
        required: false
        default: false
        type: boolean
      alert_severity:
        description: Severity to use when alert_preflight is enabled.
        required: false
        default: warning
        type: choice
        options:
          - info
          - warning
          - critical
      live_preflight:
        description: Check live release readiness gates without starting or dispatching a run.
        required: false
        default: true
        type: boolean
      live_approval_gate:
        description: Approval gate used by the live_preflight readiness payload.
        required: false
        default: safe_pr
        type: choice
        options:
          - safe_pr
          - manual
      live_environment:
        description: Release step environment to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_namespace:
        description: Kubernetes namespace to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_change_ticket:
        description: Change ticket recorded in live_preflight readiness payload.
        required: false
        type: string
      live_runbook_url:
        description: Production runbook URL recorded in live_preflight readiness payload.
        required: false
        type: string
      live_release_owner:
        description: Release owner recorded in live_preflight readiness payload.
        required: false
        type: string
      live_oncall_contact:
        description: On-call contact recorded in live_preflight readiness payload.
        required: false
        type: string
      live_image:
        description: Optional image used in the live_preflight readiness payload.
        required: false
        type: string
      live_verification_url:
        description: Optional post-deploy verification URL used by live_preflight.
        required: false
        type: string
      live_safe_pr_workflow_run_id:
        description: Existing Safe PR workflow_run_id evidence used by live_preflight.
        required: false
        type: string
      live_safe_pr_url:
        description: Existing Safe PR URL evidence used by live_preflight.
        required: false
        type: string
  workflow_call:
    inputs:
      api_base_url:
        description: API base URL. Falls back to release_flow_api_base_url secret.
        required: false
        type: string
      release_plan_id:
        description: Optional release plan id to scope the production gate.
        required: false
        type: string
      production_preflight_run_limit:
        description: Maximum release runs to inspect for each guardrail.
        required: false
        default: "20"
        type: string
      request_timeout_seconds:
        description: Per-request API timeout for the release-flow smoke script.
        required: false
        default: "15"
        type: string
      retry_attempts:
        description: Retry attempts for safe read-only smoke requests.
        required: false
        default: "5"
        type: string
      retry_delay_seconds:
        description: Delay between retry attempts for safe read-only smoke requests.
        required: false
        default: "2"
        type: string
      github_environment:
        description: GitHub Environment that protects the production gate.
        required: false
        default: production
        type: string
      artifact_retention_days:
        description: Number of days to keep release-flow smoke artifacts.
        required: false
        default: "30"
        type: string
      alert_preflight:
        description: Send a validation alert through enabled alert channels.
        required: false
        default: false
        type: boolean
      alert_severity:
        description: Severity to use when alert_preflight is enabled.
        required: false
        default: warning
        type: string
      live_preflight:
        description: Check live release readiness gates without starting or dispatching a run.
        required: false
        default: true
        type: boolean
      live_approval_gate:
        description: Approval gate used by the live_preflight readiness payload.
        required: false
        default: safe_pr
        type: string
      live_environment:
        description: Release step environment to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_namespace:
        description: Kubernetes namespace to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_change_ticket:
        description: Change ticket recorded in live_preflight readiness payload.
        required: false
        type: string
      live_runbook_url:
        description: Production runbook URL recorded in live_preflight readiness payload.
        required: false
        type: string
      live_release_owner:
        description: Release owner recorded in live_preflight readiness payload.
        required: false
        type: string
      live_oncall_contact:
        description: On-call contact recorded in live_preflight readiness payload.
        required: false
        type: string
      live_image:
        description: Optional image used in the live_preflight readiness payload.
        required: false
        type: string
      live_verification_url:
        description: Optional post-deploy verification URL used by live_preflight.
        required: false
        type: string
      live_safe_pr_workflow_run_id:
        description: Existing Safe PR workflow_run_id evidence used by live_preflight.
        required: false
        type: string
      live_safe_pr_url:
        description: Existing Safe PR URL evidence used by live_preflight.
        required: false
        type: string
    secrets:
      RELEASE_FLOW_API_BASE_URL:
        description: API base URL when the caller does not pass api_base_url.
        required: false
      RELEASE_FLOW_AUTH_EMAIL:
        description: Release-flow smoke account email.
        required: false
      RELEASE_FLOW_AUTH_PASSWORD:
        description: Release-flow smoke account password.
        required: false
    outputs:
      release_gate_ok:
        description: Whether the production release gate passed.
        value: ${{ jobs.production_gate.outputs.release_gate_ok }}
      release_smoke_ok:
        description: Whether every release-flow smoke check passed.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_ok }}
      release_smoke_failed_checks:
        description: Comma-separated failed release-flow smoke check ids.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_failed_checks }}
      release_smoke_failed_count:
        description: Number of failed release-flow smoke checks plus runtime errors.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_failed_count }}
      release_smoke_api_base_url:
        description: API base URL used by the release-flow smoke run.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_api_base_url }}
      release_smoke_error:
        description: Redacted release-flow smoke runtime error, when present.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_error }}

permissions:
  contents: read

jobs:
  validate_production_gate_inputs:
    name: Validate production gate inputs
    runs-on: ubuntu-latest
    outputs:
      production_gate_inputs_ok: ${{ steps.validate.outputs.production_gate_inputs_ok }}
    env:
      LIVE_PREFLIGHT: ${{ inputs.live_preflight }}
      LIVE_PREFLIGHT_APPROVAL_GATE: ${{ inputs.live_approval_gate || 'safe_pr' }}
      LIVE_PREFLIGHT_ENVIRONMENT: ${{ inputs.live_environment || 'production' }}
      LIVE_PREFLIGHT_CHANGE_TICKET: ${{ inputs.live_change_ticket }}
      LIVE_PREFLIGHT_RUNBOOK_URL: ${{ inputs.live_runbook_url }}
      LIVE_PREFLIGHT_RELEASE_OWNER: ${{ inputs.live_release_owner }}
      LIVE_PREFLIGHT_ONCALL_CONTACT: ${{ inputs.live_oncall_contact }}
      LIVE_PREFLIGHT_IMAGE: ${{ inputs.live_image }}
      LIVE_PREFLIGHT_VERIFICATION_URL: ${{ inputs.live_verification_url }}
      LIVE_PREFLIGHT_SAFE_PR_WORKFLOW_RUN_ID: ${{ inputs.live_safe_pr_workflow_run_id }}
      LIVE_PREFLIGHT_SAFE_PR_URL: ${{ inputs.live_safe_pr_url }}
    steps:
      - name: Validate live production inputs
        id: validate
        run: |
          normalized_environment="$(printf '%s' "$LIVE_PREFLIGHT_ENVIRONMENT" | tr '[:upper:]' '[:lower:]')"
          normalized_ticket="$(printf '%s' "$LIVE_PREFLIGHT_CHANGE_TICKET" | tr '[:lower:]' '[:upper:]')"
          if [ "$normalized_environment" = "production" ] && [ "$LIVE_PREFLIGHT" != "true" ]; then
            echo "::error title=Missing production live preflight::live_preflight must be true for production release gates."
            exit 1
          fi
          if [ "$LIVE_PREFLIGHT" = "true" ] && [ "$LIVE_PREFLIGHT_APPROVAL_GATE" = "safe_pr" ]; then
            if [ -z "$LIVE_PREFLIGHT_SAFE_PR_WORKFLOW_RUN_ID" ]; then
              echo "::error title=Missing Safe PR workflow id::live_safe_pr_workflow_run_id is required when live_approval_gate is safe_pr."
              exit 1
            fi
            if [ -z "$LIVE_PREFLIGHT_SAFE_PR_URL" ]; then
              echo "::error title=Missing Safe PR URL::live_safe_pr_url is required when live_approval_gate is safe_pr."
              exit 1
            fi
            if [[ "$LIVE_PREFLIGHT_SAFE_PR_URL" != https://* ]]; then
              echo "::error title=Invalid Safe PR URL::live_safe_pr_url must use https when live_approval_gate is safe_pr."
              exit 1
            fi
            if [[ "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"localhost"* || "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"127.0.0.1"* || "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"[::1]"* || "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"example.com"* || "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"example.test"* ]]; then
              echo "::error title=Placeholder Safe PR URL::live_safe_pr_url must not use localhost or example hosts when live_approval_gate is safe_pr."
              exit 1
            fi
          fi
          if [ "$LIVE_PREFLIGHT" = "true" ] && [ "$normalized_environment" = "production" ]; then
            if [ -z "$LIVE_PREFLIGHT_CHANGE_TICKET" ]; then
              echo "::error title=Missing production change ticket::live_change_ticket is required for production live_preflight."
              exit 1
            fi
            if [ "$normalized_ticket" = "CHG-PREFLIGHT" ]; then
              echo "::error title=Placeholder production change ticket::Replace CHG-PREFLIGHT with the real production change ticket."
              exit 1
            fi
            if [ -z "$LIVE_PREFLIGHT_RUNBOOK_URL" ]; then
              echo "::error title=Missing production runbook::live_runbook_url is required for production live_preflight."
              exit 1
            fi
            if [[ "$LIVE_PREFLIGHT_RUNBOOK_URL" != https://* ]]; then
              echo "::error title=Invalid production runbook::live_runbook_url must use https for production live_preflight."
              exit 1
            fi
            if [[ "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"localhost"* || "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"127.0.0.1"* || "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"[::1]"* || "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"example.com"* || "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"example.test"* ]]; then
              echo "::error title=Placeholder production runbook::live_runbook_url must not use localhost or example hosts for production live_preflight."
              exit 1
            fi
            if [ -z "$LIVE_PREFLIGHT_IMAGE" ]; then
              echo "::error title=Missing production image::live_image is required for production live_preflight."
              exit 1
            fi
            if [ "$LIVE_PREFLIGHT_IMAGE" = "ghcr.io/example/release-flow-smoke:live-preflight" ]; then
              echo "::error title=Placeholder production image::Replace ghcr.io/example/release-flow-smoke:live-preflight with the real production image."
              exit 1
            fi
            if [ -z "$LIVE_PREFLIGHT_VERIFICATION_URL" ]; then
              echo "::error title=Missing production verification URL::live_verification_url is required for production live_preflight."
              exit 1
            fi
            if [[ "$LIVE_PREFLIGHT_VERIFICATION_URL" != https://* ]]; then
              echo "::error title=Invalid production verification URL::live_verification_url must use https for production live_preflight."
              exit 1
            fi
            if [[ "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"localhost"* || "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"127.0.0.1"* || "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"[::1]"* || "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"example.com"* || "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"example.test"* ]]; then
              echo "::error title=Placeholder production verification URL::live_verification_url must not use localhost or example hosts for production live_preflight."
              exit 1
            fi
            if [ -z "$LIVE_PREFLIGHT_RELEASE_OWNER" ] && [ -z "$LIVE_PREFLIGHT_ONCALL_CONTACT" ]; then
              echo "::error title=Missing production owner::live_release_owner or live_oncall_contact is required for production live_preflight."
              exit 1
            fi
            if [ "$LIVE_PREFLIGHT_RELEASE_OWNER" = "release-operator" ]; then
              echo "::error title=Placeholder production owner::Replace release-operator with the real production owner."
              exit 1
            fi
            if [ "$LIVE_PREFLIGHT_ONCALL_CONTACT" = "release-oncall@example.com" ]; then
              echo "::error title=Placeholder on-call contact::Replace release-oncall@example.com with the real on-call contact."
              exit 1
            fi
          fi
          echo "production_gate_inputs_ok=true" >> "$GITHUB_OUTPUT"

  release_flow_smoke:
    name: Release-flow smoke gate
    needs: validate_production_gate_inputs
    uses: ./.github/workflows/release-flow-smoke.yml
    with:
      api_base_url: ${{ inputs.api_base_url }}
      production_preflight_plan_id: ${{ inputs.release_plan_id }}
      production_preflight_run_limit: ${{ inputs.production_preflight_run_limit || '20' }}
      request_timeout_seconds: ${{ inputs.request_timeout_seconds || '15' }}
      retry_attempts: ${{ inputs.retry_attempts || '5' }}
      retry_delay_seconds: ${{ inputs.retry_delay_seconds || '2' }}
      github_environment: ${{ inputs.github_environment || 'production' }}
      artifact_retention_days: ${{ inputs.artifact_retention_days || '30' }}
      artifact_name: release-flow-smoke-${{ inputs.github_environment || 'production' }}
      alert_preflight: ${{ inputs.alert_preflight || false }}
      alert_severity: ${{ inputs.alert_severity || 'warning' }}
      live_preflight: ${{ inputs.live_preflight }}
      live_approval_gate: ${{ inputs.live_approval_gate || 'safe_pr' }}
      live_environment: ${{ inputs.live_environment || 'production' }}
      live_namespace: ${{ inputs.live_namespace || 'production' }}
      live_change_ticket: ${{ inputs.live_change_ticket }}
      live_runbook_url: ${{ inputs.live_runbook_url }}
      live_release_owner: ${{ inputs.live_release_owner }}
      live_oncall_contact: ${{ inputs.live_oncall_contact }}
      live_image: ${{ inputs.live_image }}
      live_verification_url: ${{ inputs.live_verification_url }}
      live_safe_pr_workflow_run_id: ${{ inputs.live_safe_pr_workflow_run_id }}
      live_safe_pr_url: ${{ inputs.live_safe_pr_url }}
    secrets:
      RELEASE_FLOW_API_BASE_URL: ${{ secrets.RELEASE_FLOW_API_BASE_URL }}
      RELEASE_FLOW_AUTH_EMAIL: ${{ secrets.RELEASE_FLOW_AUTH_EMAIL }}
      RELEASE_FLOW_AUTH_PASSWORD: ${{ secrets.RELEASE_FLOW_AUTH_PASSWORD }}

  production_gate:
    name: Require successful release-flow smoke
    runs-on: ubuntu-latest
    needs: release_flow_smoke
    if: always()
    outputs:
      release_gate_ok: ${{ steps.production_gate.outputs.release_gate_ok }}
    steps:
      - name: Summarize production release gate
        id: production_gate
        env:
          RELEASE_SMOKE_OK: ${{ needs.release_flow_smoke.outputs.release_smoke_ok }}
          RELEASE_SMOKE_FAILED_CHECKS: ${{ needs.release_flow_smoke.outputs.release_smoke_failed_checks }}
          RELEASE_SMOKE_FAILED_COUNT: ${{ needs.release_flow_smoke.outputs.release_smoke_failed_count }}
          RELEASE_SMOKE_API_BASE_URL: ${{ needs.release_flow_smoke.outputs.release_smoke_api_base_url }}
          RELEASE_SMOKE_ERROR: ${{ needs.release_flow_smoke.outputs.release_smoke_error }}
        run: |
          if [ "$RELEASE_SMOKE_OK" = "true" ]; then
            echo "release_gate_ok=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Release Flow Production Gate"
              echo
              echo "- Result: passed"
              echo "- API base URL: ${RELEASE_SMOKE_API_BASE_URL:-not reported}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "release_gate_ok=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Release Flow Production Gate"
            echo
            echo "- Result: failed"
            echo "- API base URL: ${RELEASE_SMOKE_API_BASE_URL:-not reported}"
            echo "- Failed checks: ${RELEASE_SMOKE_FAILED_CHECKS:-not reported}"
            echo "- Failed count: ${RELEASE_SMOKE_FAILED_COUNT:-not reported}"
            if [ -n "$RELEASE_SMOKE_ERROR" ]; then
              echo "- Error: $RELEASE_SMOKE_ERROR"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "release-flow production gate failed"
          exit 1
