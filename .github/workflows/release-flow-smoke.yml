name: Release Flow Smoke

"on":
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API base URL. Falls back to RELEASE_FLOW_API_BASE_URL secret.
        required: false
        type: string
      production_preflight_plan_id:
        description: Optional release plan id to scope the production preflight.
        required: false
        type: string
      production_preflight_run_limit:
        description: Maximum release runs to inspect for each guardrail.
        required: false
        default: "20"
        type: string
  workflow_call:
    inputs:
      api_base_url:
        description: API base URL. Falls back to release_flow_api_base_url secret.
        required: false
        type: string
      production_preflight_plan_id:
        description: Optional release plan id to scope the production preflight.
        required: false
        type: string
      production_preflight_run_limit:
        description: Maximum release runs to inspect for each guardrail.
        required: false
        default: "20"
        type: string
    secrets:
      release_flow_api_base_url:
        description: API base URL when the caller does not pass api_base_url.
        required: false
      release_flow_auth_email:
        description: Release-flow smoke account email.
        required: false
      release_flow_auth_password:
        description: Release-flow smoke account password.
        required: false
    outputs:
      release_smoke_ok:
        description: Whether every release-flow smoke check passed.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_ok }}
      release_smoke_failed_checks:
        description: Comma-separated failed release-flow smoke check ids.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_failed_checks }}
      release_smoke_error:
        description: Redacted release-flow smoke runtime error, when present.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_error }}

permissions:
  contents: read

jobs:
  release_flow_smoke:
    name: Production preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_smoke_ok: ${{ steps.release_flow_smoke.outputs.release_smoke_ok }}
      release_smoke_failed_checks: ${{ steps.release_flow_smoke.outputs.release_smoke_failed_checks }}
      release_smoke_error: ${{ steps.release_flow_smoke.outputs.release_smoke_error }}
    env:
      API_BASE_URL: ${{ inputs.api_base_url || secrets.release_flow_api_base_url || secrets.RELEASE_FLOW_API_BASE_URL }}
      AUTH_EMAIL: ${{ secrets.release_flow_auth_email || secrets.RELEASE_FLOW_AUTH_EMAIL }}
      AUTH_PASSWORD: ${{ secrets.release_flow_auth_password || secrets.RELEASE_FLOW_AUTH_PASSWORD }}
      PRODUCTION_PREFLIGHT_PLAN_ID: ${{ inputs.production_preflight_plan_id }}
      PRODUCTION_PREFLIGHT_RUN_LIMIT: ${{ inputs.production_preflight_run_limit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run release-flow production smoke
        id: release_flow_smoke
        continue-on-error: true
        run: |
          python scripts/release_flow_smoke.py \
            --production-preflight \
            --production-preflight-plan-id "${PRODUCTION_PREFLIGHT_PLAN_ID}" \
            --production-preflight-run-limit "${PRODUCTION_PREFLIGHT_RUN_LIMIT:-20}" \
            --retry-attempts 5 \
            --retry-delay-seconds 2 \
            --ci \
            --ci-artifacts-dir artifacts/release-flow

      - name: Upload release-flow smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-flow-smoke
          path: artifacts/release-flow
          if-no-files-found: warn

      - name: Fail when release-flow smoke failed
        if: steps.release_flow_smoke.outputs.release_smoke_ok != 'true'
        env:
          FAILED_CHECKS: ${{ steps.release_flow_smoke.outputs.release_smoke_failed_checks }}
          SMOKE_ERROR: ${{ steps.release_flow_smoke.outputs.release_smoke_error }}
        run: |
          echo "release-flow smoke failed"
          if [ -n "$FAILED_CHECKS" ]; then
            echo "failed checks: $FAILED_CHECKS"
          fi
          if [ -n "$SMOKE_ERROR" ]; then
            echo "error: $SMOKE_ERROR"
          fi
          exit 1
