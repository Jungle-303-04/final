name: Release Flow Smoke
run-name: Release Flow Smoke / ${{ inputs.github_environment || 'production' }} / ${{ inputs.production_preflight_plan_id || 'all-plans' }}

"on":
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API base URL. Falls back to RELEASE_FLOW_API_BASE_URL secret.
        required: false
        type: string
      production_preflight_plan_id:
        description: Optional release plan id to scope the production preflight.
        required: false
        type: string
      production_preflight_run_limit:
        description: Maximum release runs to inspect for each guardrail.
        required: false
        default: "20"
        type: string
      request_timeout_seconds:
        description: Per-request API timeout for the release-flow smoke script.
        required: false
        default: "15"
        type: string
      retry_attempts:
        description: Retry attempts for safe read-only smoke requests.
        required: false
        default: "5"
        type: string
      retry_delay_seconds:
        description: Delay between retry attempts for safe read-only smoke requests.
        required: false
        default: "2"
        type: string
      github_environment:
        description: GitHub Environment that protects this smoke gate.
        required: false
        default: production
        type: string
      artifact_retention_days:
        description: Number of days to keep release-flow smoke artifacts.
        required: false
        default: "30"
        type: string
      artifact_name:
        description: Name for the uploaded release-flow smoke artifact.
        required: false
        default: release-flow-smoke
        type: string
      alert_preflight:
        description: Send a validation alert through enabled alert channels.
        required: false
        default: false
        type: boolean
      alert_severity:
        description: Severity to use when alert_preflight is enabled.
        required: false
        default: warning
        type: choice
        options:
          - info
          - warning
          - critical
      live_preflight:
        description: Check live release readiness gates without starting or dispatching a run.
        required: false
        default: false
        type: boolean
      live_approval_gate:
        description: Approval gate used by the live_preflight readiness payload.
        required: false
        default: manual
        type: choice
        options:
          - manual
          - safe_pr
      live_environment:
        description: Release step environment to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_namespace:
        description: Kubernetes namespace to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_change_ticket:
        description: Change ticket recorded in live_preflight readiness payload.
        required: false
        type: string
      live_runbook_url:
        description: Production runbook URL recorded in live_preflight readiness payload.
        required: false
        type: string
      live_release_owner:
        description: Release owner recorded in live_preflight readiness payload.
        required: false
        type: string
      live_oncall_contact:
        description: On-call contact recorded in live_preflight readiness payload.
        required: false
        type: string
      live_image:
        description: Optional image used in the live_preflight readiness payload.
        required: false
        type: string
      live_verification_url:
        description: Optional post-deploy verification URL used by live_preflight.
        required: false
        type: string
      live_safe_pr_workflow_run_id:
        description: Existing Safe PR workflow_run_id evidence used by live_preflight.
        required: false
        type: string
      live_safe_pr_url:
        description: Existing Safe PR URL evidence used by live_preflight.
        required: false
        type: string
  workflow_call:
    inputs:
      api_base_url:
        description: API base URL. Falls back to release_flow_api_base_url secret.
        required: false
        type: string
      production_preflight_plan_id:
        description: Optional release plan id to scope the production preflight.
        required: false
        type: string
      production_preflight_run_limit:
        description: Maximum release runs to inspect for each guardrail.
        required: false
        default: "20"
        type: string
      request_timeout_seconds:
        description: Per-request API timeout for the release-flow smoke script.
        required: false
        default: "15"
        type: string
      retry_attempts:
        description: Retry attempts for safe read-only smoke requests.
        required: false
        default: "5"
        type: string
      retry_delay_seconds:
        description: Delay between retry attempts for safe read-only smoke requests.
        required: false
        default: "2"
        type: string
      github_environment:
        description: GitHub Environment that protects this smoke gate.
        required: false
        default: production
        type: string
      artifact_retention_days:
        description: Number of days to keep release-flow smoke artifacts.
        required: false
        default: "30"
        type: string
      artifact_name:
        description: Name for the uploaded release-flow smoke artifact.
        required: false
        default: release-flow-smoke
        type: string
      alert_preflight:
        description: Send a validation alert through enabled alert channels.
        required: false
        default: false
        type: boolean
      alert_severity:
        description: Severity to use when alert_preflight is enabled.
        required: false
        default: warning
        type: string
      live_preflight:
        description: Check live release readiness gates without starting or dispatching a run.
        required: false
        default: false
        type: boolean
      live_approval_gate:
        description: Approval gate used by the live_preflight readiness payload.
        required: false
        default: manual
        type: string
      live_environment:
        description: Release step environment to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_namespace:
        description: Kubernetes namespace to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_change_ticket:
        description: Change ticket recorded in live_preflight readiness payload.
        required: false
        type: string
      live_runbook_url:
        description: Production runbook URL recorded in live_preflight readiness payload.
        required: false
        type: string
      live_release_owner:
        description: Release owner recorded in live_preflight readiness payload.
        required: false
        type: string
      live_oncall_contact:
        description: On-call contact recorded in live_preflight readiness payload.
        required: false
        type: string
      live_image:
        description: Optional image used in the live_preflight readiness payload.
        required: false
        type: string
      live_verification_url:
        description: Optional post-deploy verification URL used by live_preflight.
        required: false
        type: string
      live_safe_pr_workflow_run_id:
        description: Existing Safe PR workflow_run_id evidence used by live_preflight.
        required: false
        type: string
      live_safe_pr_url:
        description: Existing Safe PR URL evidence used by live_preflight.
        required: false
        type: string
    secrets:
      RELEASE_FLOW_API_BASE_URL:
        description: API base URL when the caller does not pass api_base_url.
        required: false
      RELEASE_FLOW_AUTH_EMAIL:
        description: Release-flow smoke account email.
        required: false
      RELEASE_FLOW_AUTH_PASSWORD:
        description: Release-flow smoke account password.
        required: false
    outputs:
      release_smoke_ok:
        description: Whether every release-flow smoke check passed.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_ok }}
      release_smoke_failed_checks:
        description: Comma-separated failed release-flow smoke check ids.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_failed_checks }}
      release_smoke_failed_count:
        description: Number of failed release-flow smoke checks plus runtime errors.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_failed_count }}
      release_smoke_api_base_url:
        description: API base URL used by the release-flow smoke run.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_api_base_url }}
      release_smoke_error:
        description: Redacted release-flow smoke runtime error, when present.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_error }}

permissions:
  contents: read

jobs:
  release_flow_smoke:
    name: Production preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.github_environment || 'production' }}
    concurrency:
      group: release-flow-smoke-${{ inputs.github_environment || 'production' }}
      cancel-in-progress: false
    outputs:
      release_smoke_ok: ${{ steps.release_flow_smoke.outputs.release_smoke_ok }}
      release_smoke_failed_checks: ${{ steps.release_flow_smoke.outputs.release_smoke_failed_checks }}
      release_smoke_failed_count: ${{ steps.release_flow_smoke.outputs.release_smoke_failed_count }}
      release_smoke_api_base_url: ${{ steps.release_flow_smoke.outputs.release_smoke_api_base_url }}
      release_smoke_error: ${{ steps.release_flow_smoke.outputs.release_smoke_error }}
    env:
      API_BASE_URL: ${{ inputs.api_base_url || secrets.RELEASE_FLOW_API_BASE_URL }}
      AUTH_EMAIL: ${{ secrets.RELEASE_FLOW_AUTH_EMAIL }}
      AUTH_PASSWORD: ${{ secrets.RELEASE_FLOW_AUTH_PASSWORD }}
      PRODUCTION_PREFLIGHT_PLAN_ID: ${{ inputs.production_preflight_plan_id }}
      PRODUCTION_PREFLIGHT_RUN_LIMIT: ${{ inputs.production_preflight_run_limit || '20' }}
      REQUEST_TIMEOUT_SECONDS: ${{ inputs.request_timeout_seconds || '15' }}
      RETRY_ATTEMPTS: ${{ inputs.retry_attempts || '5' }}
      RETRY_DELAY_SECONDS: ${{ inputs.retry_delay_seconds || '2' }}
      ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days || '30' }}
      ARTIFACT_NAME: ${{ inputs.artifact_name || 'release-flow-smoke' }}
      ALERT_PREFLIGHT: ${{ inputs.alert_preflight || false }}
      ALERT_PREFLIGHT_SEVERITY: ${{ inputs.alert_severity || 'warning' }}
      LIVE_PREFLIGHT: ${{ inputs.live_preflight || false }}
      LIVE_PREFLIGHT_APPROVAL_GATE: ${{ inputs.live_approval_gate || 'manual' }}
      LIVE_PREFLIGHT_ENVIRONMENT: ${{ inputs.live_environment || 'production' }}
      LIVE_PREFLIGHT_NAMESPACE: ${{ inputs.live_namespace || 'production' }}
      LIVE_PREFLIGHT_CHANGE_TICKET: ${{ inputs.live_change_ticket }}
      LIVE_PREFLIGHT_RUNBOOK_URL: ${{ inputs.live_runbook_url }}
      LIVE_PREFLIGHT_RELEASE_OWNER: ${{ inputs.live_release_owner }}
      LIVE_PREFLIGHT_ONCALL_CONTACT: ${{ inputs.live_oncall_contact }}
      LIVE_PREFLIGHT_IMAGE: ${{ inputs.live_image }}
      LIVE_PREFLIGHT_VERIFICATION_URL: ${{ inputs.live_verification_url }}
      LIVE_PREFLIGHT_SAFE_PR_WORKFLOW_RUN_ID: ${{ inputs.live_safe_pr_workflow_run_id }}
      LIVE_PREFLIGHT_SAFE_PR_URL: ${{ inputs.live_safe_pr_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate workflow inputs
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error title=Missing release-flow API URL::Set api_base_url or RELEASE_FLOW_API_BASE_URL before running production smoke."
            exit 1
          fi
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "::error title=Invalid release-flow API URL::release-flow production smoke requires an https API base URL."
            exit 1
          fi
          if [[ "$API_BASE_URL" == *"localhost"* || "$API_BASE_URL" == *"127.0.0.1"* || "$API_BASE_URL" == *"example.com"* ]]; then
            echo "::error title=Invalid release-flow API URL::release-flow production smoke must not target localhost or example hosts."
            exit 1
          fi
          if [ -z "$AUTH_EMAIL" ]; then
            echo "::error title=Missing release-flow auth email::Set RELEASE_FLOW_AUTH_EMAIL before running production smoke."
            exit 1
          fi
          if [ -z "$AUTH_PASSWORD" ]; then
            echo "::error title=Missing release-flow auth password::Set RELEASE_FLOW_AUTH_PASSWORD before running production smoke."
            exit 1
          fi
          if ! [[ "$PRODUCTION_PREFLIGHT_RUN_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid production_preflight_run_limit::production_preflight_run_limit must be an integer between 1 and 500."
            exit 1
          fi
          if [ "$PRODUCTION_PREFLIGHT_RUN_LIMIT" -lt 1 ] || [ "$PRODUCTION_PREFLIGHT_RUN_LIMIT" -gt 500 ]; then
            echo "::error title=Invalid production_preflight_run_limit::production_preflight_run_limit must be between 1 and 500."
            exit 1
          fi
          if ! [[ "$REQUEST_TIMEOUT_SECONDS" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error title=Invalid request_timeout_seconds::request_timeout_seconds must be a number between 1 and 120."
            exit 1
          fi
          awk "BEGIN { exit !($REQUEST_TIMEOUT_SECONDS >= 1 && $REQUEST_TIMEOUT_SECONDS <= 120) }" || {
            echo "::error title=Invalid request_timeout_seconds::request_timeout_seconds must be between 1 and 120."
            exit 1
          }
          if ! [[ "$RETRY_ATTEMPTS" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid retry_attempts::retry_attempts must be an integer between 1 and 10."
            exit 1
          fi
          if [ "$RETRY_ATTEMPTS" -lt 1 ] || [ "$RETRY_ATTEMPTS" -gt 10 ]; then
            echo "::error title=Invalid retry_attempts::retry_attempts must be between 1 and 10."
            exit 1
          fi
          if ! [[ "$RETRY_DELAY_SECONDS" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error title=Invalid retry_delay_seconds::retry_delay_seconds must be a number between 0 and 30."
            exit 1
          fi
          awk "BEGIN { exit !($RETRY_DELAY_SECONDS >= 0 && $RETRY_DELAY_SECONDS <= 30) }" || {
            echo "::error title=Invalid retry_delay_seconds::retry_delay_seconds must be between 0 and 30."
            exit 1
          }
          if ! [[ "$ARTIFACT_RETENTION_DAYS" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid artifact_retention_days::artifact_retention_days must be an integer between 1 and 90."
            exit 1
          fi
          if [ "$ARTIFACT_RETENTION_DAYS" -lt 1 ] || [ "$ARTIFACT_RETENTION_DAYS" -gt 90 ]; then
            echo "::error title=Invalid artifact_retention_days::artifact_retention_days must be between 1 and 90."
            exit 1
          fi
          if [ -z "$ARTIFACT_NAME" ]; then
            echo "::error title=Invalid artifact_name::artifact_name is required."
            exit 1
          fi
          if [[ "$ARTIFACT_NAME" =~ [\\/:*?\"<>|] ]]; then
            echo "::error title=Invalid artifact_name::artifact_name cannot contain \\, /, :, *, ?, quote, <, >, or |."
            exit 1
          fi
          if [ "$ALERT_PREFLIGHT" = "true" ]; then
            case "$ALERT_PREFLIGHT_SEVERITY" in
              info|warning|critical) ;;
              *)
                echo "::error title=Invalid alert_severity::alert_severity must be one of info, warning, or critical."
                exit 1
                ;;
            esac
          fi
          if [ "$LIVE_PREFLIGHT" = "true" ]; then
            case "$LIVE_PREFLIGHT_APPROVAL_GATE" in
              manual|safe_pr) ;;
              *)
                echo "::error title=Invalid live_approval_gate::live_approval_gate must be manual or safe_pr."
                exit 1
                ;;
            esac
            if [ "$LIVE_PREFLIGHT_APPROVAL_GATE" = "safe_pr" ]; then
              if [ -z "$LIVE_PREFLIGHT_SAFE_PR_WORKFLOW_RUN_ID" ]; then
                echo "::error title=Missing Safe PR workflow id::live_safe_pr_workflow_run_id is required when live_approval_gate is safe_pr."
                exit 1
              fi
              if [ -z "$LIVE_PREFLIGHT_SAFE_PR_URL" ]; then
                echo "::error title=Missing Safe PR URL::live_safe_pr_url is required when live_approval_gate is safe_pr."
                exit 1
              fi
              if [[ "$LIVE_PREFLIGHT_SAFE_PR_URL" != https://* ]]; then
                echo "::error title=Invalid Safe PR URL::live_safe_pr_url must use https when live_approval_gate is safe_pr."
                exit 1
              fi
              if [[ "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"localhost"* || "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"127.0.0.1"* || "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"[::1]"* || "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"example.com"* || "$LIVE_PREFLIGHT_SAFE_PR_URL" == *"example.test"* ]]; then
                echo "::error title=Placeholder Safe PR URL::live_safe_pr_url must not use localhost or example hosts when live_approval_gate is safe_pr."
                exit 1
              fi
            fi
            dns_label='^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
            if ! [[ "$LIVE_PREFLIGHT_ENVIRONMENT" =~ $dns_label ]]; then
              echo "::error title=Invalid live_environment::live_environment must be a Kubernetes-style DNS label."
              exit 1
            fi
            if ! [[ "$LIVE_PREFLIGHT_NAMESPACE" =~ $dns_label ]]; then
              echo "::error title=Invalid live_namespace::live_namespace must be a Kubernetes-style DNS label."
              exit 1
            fi
            if [ -z "$LIVE_PREFLIGHT_CHANGE_TICKET" ]; then
              echo "::error title=Invalid live_change_ticket::live_change_ticket is required when live_preflight is enabled."
              exit 1
            fi
            if [ "$LIVE_PREFLIGHT_ENVIRONMENT" = "production" ] && [ "$LIVE_PREFLIGHT_CHANGE_TICKET" = "CHG-PREFLIGHT" ]; then
              echo "::error title=Invalid live_change_ticket::live_change_ticket must not use CHG-PREFLIGHT for production live_preflight."
              exit 1
            fi
            if [ "$LIVE_PREFLIGHT_ENVIRONMENT" = "production" ]; then
              if [ -z "$LIVE_PREFLIGHT_RUNBOOK_URL" ]; then
                echo "::error title=Invalid live_runbook_url::live_runbook_url is required for production live_preflight."
                exit 1
              fi
              if [[ "$LIVE_PREFLIGHT_RUNBOOK_URL" != https://* ]]; then
                echo "::error title=Invalid live_runbook_url::live_runbook_url must use https for production live_preflight."
                exit 1
              fi
              if [[ "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"localhost"* || "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"127.0.0.1"* || "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"[::1]"* || "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"example.com"* || "$LIVE_PREFLIGHT_RUNBOOK_URL" == *"example.test"* ]]; then
                echo "::error title=Invalid live_runbook_url::live_runbook_url must not use localhost or example hosts for production live_preflight."
                exit 1
              fi
              if [ -z "$LIVE_PREFLIGHT_IMAGE" ]; then
                echo "::error title=Invalid live_image::live_image is required for production live_preflight."
                exit 1
              fi
              if [ "$LIVE_PREFLIGHT_IMAGE" = "ghcr.io/example/release-flow-smoke:live-preflight" ]; then
                echo "::error title=Invalid live_image::live_image must not use the demo live preflight image for production live_preflight."
                exit 1
              fi
              if [ -z "$LIVE_PREFLIGHT_VERIFICATION_URL" ]; then
                echo "::error title=Invalid live_verification_url::live_verification_url is required for production live_preflight."
                exit 1
              fi
              if [[ "$LIVE_PREFLIGHT_VERIFICATION_URL" != https://* ]]; then
                echo "::error title=Invalid live_verification_url::live_verification_url must use https for production live_preflight."
                exit 1
              fi
              if [[ "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"localhost"* || "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"127.0.0.1"* || "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"[::1]"* || "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"example.com"* || "$LIVE_PREFLIGHT_VERIFICATION_URL" == *"example.test"* ]]; then
                echo "::error title=Invalid live_verification_url::live_verification_url must not use localhost or example hosts for production live_preflight."
                exit 1
              fi
              if [ -z "$LIVE_PREFLIGHT_RELEASE_OWNER" ] && [ -z "$LIVE_PREFLIGHT_ONCALL_CONTACT" ]; then
                echo "::error title=Invalid live owner::live_release_owner or live_oncall_contact is required for production live_preflight."
                exit 1
              fi
              if [ "$LIVE_PREFLIGHT_RELEASE_OWNER" = "release-operator" ]; then
                echo "::error title=Invalid live_release_owner::live_release_owner must identify the real production owner."
                exit 1
              fi
              if [ "$LIVE_PREFLIGHT_ONCALL_CONTACT" = "release-oncall@example.com" ]; then
                echo "::error title=Invalid live_oncall_contact::live_oncall_contact must identify the real on-call contact."
                exit 1
              fi
            fi
          fi

      - name: Run release-flow production smoke
        id: release_flow_smoke
        continue-on-error: true
        run: |
          smoke_args=(
            --production-preflight
            --production-preflight-plan-id "${PRODUCTION_PREFLIGHT_PLAN_ID}"
            --production-preflight-run-limit "${PRODUCTION_PREFLIGHT_RUN_LIMIT}"
            --timeout "${REQUEST_TIMEOUT_SECONDS}"
            --retry-attempts "${RETRY_ATTEMPTS}"
            --retry-delay-seconds "${RETRY_DELAY_SECONDS}"
            --ci
            --ci-artifacts-dir artifacts/release-flow
          )
          if [ "$LIVE_PREFLIGHT" = "true" ]; then
            smoke_args+=(
              --live-preflight
              --live-environment "${LIVE_PREFLIGHT_ENVIRONMENT}"
              --live-namespace "${LIVE_PREFLIGHT_NAMESPACE}"
              --live-change-ticket "${LIVE_PREFLIGHT_CHANGE_TICKET}"
              --live-runbook-url "${LIVE_PREFLIGHT_RUNBOOK_URL}"
              --live-release-owner "${LIVE_PREFLIGHT_RELEASE_OWNER}"
              --live-oncall-contact "${LIVE_PREFLIGHT_ONCALL_CONTACT}"
              --live-image "${LIVE_PREFLIGHT_IMAGE}"
              --live-approval-gate "${LIVE_PREFLIGHT_APPROVAL_GATE}"
              --live-verification-url "${LIVE_PREFLIGHT_VERIFICATION_URL}"
              --live-safe-pr-workflow-run-id "${LIVE_PREFLIGHT_SAFE_PR_WORKFLOW_RUN_ID}"
              --live-safe-pr-url "${LIVE_PREFLIGHT_SAFE_PR_URL}"
            )
          fi
          if [ "$ALERT_PREFLIGHT" = "true" ]; then
            smoke_args+=(--alert-preflight --alert-severity "${ALERT_PREFLIGHT_SEVERITY}")
          fi
          python scripts/release_flow_smoke.py \
            "${smoke_args[@]}"

      - name: Upload release-flow smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/release-flow
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Fail when release-flow smoke failed
        if: steps.release_flow_smoke.outputs.release_smoke_ok != 'true'
        env:
          FAILED_CHECKS: ${{ steps.release_flow_smoke.outputs.release_smoke_failed_checks }}
          SMOKE_ERROR: ${{ steps.release_flow_smoke.outputs.release_smoke_error }}
        run: |
          echo "release-flow smoke failed"
          if [ -n "$FAILED_CHECKS" ]; then
            echo "failed checks: $FAILED_CHECKS"
          fi
          if [ -n "$SMOKE_ERROR" ]; then
            echo "error: $SMOKE_ERROR"
          fi
          exit 1
