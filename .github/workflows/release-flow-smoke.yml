name: Release Flow Smoke

"on":
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API base URL. Falls back to RELEASE_FLOW_API_BASE_URL secret.
        required: false
        type: string
      production_preflight_plan_id:
        description: Optional release plan id to scope the production preflight.
        required: false
        type: string
      production_preflight_run_limit:
        description: Maximum release runs to inspect for each guardrail.
        required: false
        default: "20"
        type: string
      github_environment:
        description: GitHub Environment that protects this smoke gate.
        required: false
        default: production
        type: string
      artifact_retention_days:
        description: Number of days to keep release-flow smoke artifacts.
        required: false
        default: "30"
        type: string
      alert_preflight:
        description: Send a validation alert through enabled alert channels.
        required: false
        default: false
        type: boolean
      alert_severity:
        description: Severity to use when alert_preflight is enabled.
        required: false
        default: warning
        type: choice
        options:
          - info
          - warning
          - critical
      live_preflight:
        description: Check live release readiness gates without starting or dispatching a run.
        required: false
        default: false
        type: boolean
      live_environment:
        description: Release step environment to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_namespace:
        description: Kubernetes namespace to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_change_ticket:
        description: Change ticket recorded in live_preflight readiness payload.
        required: false
        default: CHG-PREFLIGHT
        type: string
      live_image:
        description: Optional image used in the live_preflight readiness payload.
        required: false
        type: string
      live_verification_url:
        description: Optional post-deploy verification URL used by live_preflight.
        required: false
        type: string
  workflow_call:
    inputs:
      api_base_url:
        description: API base URL. Falls back to release_flow_api_base_url secret.
        required: false
        type: string
      production_preflight_plan_id:
        description: Optional release plan id to scope the production preflight.
        required: false
        type: string
      production_preflight_run_limit:
        description: Maximum release runs to inspect for each guardrail.
        required: false
        default: "20"
        type: string
      github_environment:
        description: GitHub Environment that protects this smoke gate.
        required: false
        default: production
        type: string
      artifact_retention_days:
        description: Number of days to keep release-flow smoke artifacts.
        required: false
        default: "30"
        type: string
      alert_preflight:
        description: Send a validation alert through enabled alert channels.
        required: false
        default: false
        type: boolean
      alert_severity:
        description: Severity to use when alert_preflight is enabled.
        required: false
        default: warning
        type: string
      live_preflight:
        description: Check live release readiness gates without starting or dispatching a run.
        required: false
        default: false
        type: boolean
      live_environment:
        description: Release step environment to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_namespace:
        description: Kubernetes namespace to use when live_preflight is enabled.
        required: false
        default: production
        type: string
      live_change_ticket:
        description: Change ticket recorded in live_preflight readiness payload.
        required: false
        default: CHG-PREFLIGHT
        type: string
      live_image:
        description: Optional image used in the live_preflight readiness payload.
        required: false
        type: string
      live_verification_url:
        description: Optional post-deploy verification URL used by live_preflight.
        required: false
        type: string
    secrets:
      release_flow_api_base_url:
        description: API base URL when the caller does not pass api_base_url.
        required: false
      release_flow_auth_email:
        description: Release-flow smoke account email.
        required: false
      release_flow_auth_password:
        description: Release-flow smoke account password.
        required: false
    outputs:
      release_smoke_ok:
        description: Whether every release-flow smoke check passed.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_ok }}
      release_smoke_failed_checks:
        description: Comma-separated failed release-flow smoke check ids.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_failed_checks }}
      release_smoke_error:
        description: Redacted release-flow smoke runtime error, when present.
        value: ${{ jobs.release_flow_smoke.outputs.release_smoke_error }}

permissions:
  contents: read

jobs:
  release_flow_smoke:
    name: Production preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.github_environment || 'production' }}
    concurrency:
      group: release-flow-smoke-${{ inputs.github_environment || 'production' }}
      cancel-in-progress: false
    outputs:
      release_smoke_ok: ${{ steps.release_flow_smoke.outputs.release_smoke_ok }}
      release_smoke_failed_checks: ${{ steps.release_flow_smoke.outputs.release_smoke_failed_checks }}
      release_smoke_error: ${{ steps.release_flow_smoke.outputs.release_smoke_error }}
    env:
      API_BASE_URL: ${{ inputs.api_base_url || secrets.release_flow_api_base_url || secrets.RELEASE_FLOW_API_BASE_URL }}
      AUTH_EMAIL: ${{ secrets.release_flow_auth_email || secrets.RELEASE_FLOW_AUTH_EMAIL }}
      AUTH_PASSWORD: ${{ secrets.release_flow_auth_password || secrets.RELEASE_FLOW_AUTH_PASSWORD }}
      PRODUCTION_PREFLIGHT_PLAN_ID: ${{ inputs.production_preflight_plan_id }}
      PRODUCTION_PREFLIGHT_RUN_LIMIT: ${{ inputs.production_preflight_run_limit || '20' }}
      ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days || '30' }}
      ALERT_PREFLIGHT: ${{ inputs.alert_preflight || false }}
      ALERT_PREFLIGHT_SEVERITY: ${{ inputs.alert_severity || 'warning' }}
      LIVE_PREFLIGHT: ${{ inputs.live_preflight || false }}
      LIVE_PREFLIGHT_ENVIRONMENT: ${{ inputs.live_environment || 'production' }}
      LIVE_PREFLIGHT_NAMESPACE: ${{ inputs.live_namespace || 'production' }}
      LIVE_PREFLIGHT_CHANGE_TICKET: ${{ inputs.live_change_ticket || 'CHG-PREFLIGHT' }}
      LIVE_PREFLIGHT_IMAGE: ${{ inputs.live_image }}
      LIVE_PREFLIGHT_VERIFICATION_URL: ${{ inputs.live_verification_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate workflow inputs
        run: |
          if ! [[ "$PRODUCTION_PREFLIGHT_RUN_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid production_preflight_run_limit::production_preflight_run_limit must be an integer between 1 and 500."
            exit 1
          fi
          if [ "$PRODUCTION_PREFLIGHT_RUN_LIMIT" -lt 1 ] || [ "$PRODUCTION_PREFLIGHT_RUN_LIMIT" -gt 500 ]; then
            echo "::error title=Invalid production_preflight_run_limit::production_preflight_run_limit must be between 1 and 500."
            exit 1
          fi
          if ! [[ "$ARTIFACT_RETENTION_DAYS" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid artifact_retention_days::artifact_retention_days must be an integer between 1 and 90."
            exit 1
          fi
          if [ "$ARTIFACT_RETENTION_DAYS" -lt 1 ] || [ "$ARTIFACT_RETENTION_DAYS" -gt 90 ]; then
            echo "::error title=Invalid artifact_retention_days::artifact_retention_days must be between 1 and 90."
            exit 1
          fi
          if [ "$ALERT_PREFLIGHT" = "true" ]; then
            case "$ALERT_PREFLIGHT_SEVERITY" in
              info|warning|critical) ;;
              *)
                echo "::error title=Invalid alert_severity::alert_severity must be one of info, warning, or critical."
                exit 1
                ;;
            esac
          fi
          if [ "$LIVE_PREFLIGHT" = "true" ]; then
            dns_label='^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
            if ! [[ "$LIVE_PREFLIGHT_ENVIRONMENT" =~ $dns_label ]]; then
              echo "::error title=Invalid live_environment::live_environment must be a Kubernetes-style DNS label."
              exit 1
            fi
            if ! [[ "$LIVE_PREFLIGHT_NAMESPACE" =~ $dns_label ]]; then
              echo "::error title=Invalid live_namespace::live_namespace must be a Kubernetes-style DNS label."
              exit 1
            fi
            if [ -z "$LIVE_PREFLIGHT_CHANGE_TICKET" ]; then
              echo "::error title=Invalid live_change_ticket::live_change_ticket is required when live_preflight is enabled."
              exit 1
            fi
          fi

      - name: Run release-flow production smoke
        id: release_flow_smoke
        continue-on-error: true
        run: |
          smoke_args=(
            --production-preflight
            --production-preflight-plan-id "${PRODUCTION_PREFLIGHT_PLAN_ID}"
            --production-preflight-run-limit "${PRODUCTION_PREFLIGHT_RUN_LIMIT}"
            --retry-attempts 5
            --retry-delay-seconds 2
            --ci
            --ci-artifacts-dir artifacts/release-flow
          )
          if [ "$LIVE_PREFLIGHT" = "true" ]; then
            smoke_args+=(
              --live-preflight
              --live-environment "${LIVE_PREFLIGHT_ENVIRONMENT}"
              --live-namespace "${LIVE_PREFLIGHT_NAMESPACE}"
              --live-change-ticket "${LIVE_PREFLIGHT_CHANGE_TICKET}"
              --live-image "${LIVE_PREFLIGHT_IMAGE}"
              --live-verification-url "${LIVE_PREFLIGHT_VERIFICATION_URL}"
            )
          fi
          if [ "$ALERT_PREFLIGHT" = "true" ]; then
            smoke_args+=(--alert-preflight --alert-severity "${ALERT_PREFLIGHT_SEVERITY}")
          fi
          python scripts/release_flow_smoke.py \
            "${smoke_args[@]}"

      - name: Upload release-flow smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-flow-smoke
          path: artifacts/release-flow
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Fail when release-flow smoke failed
        if: steps.release_flow_smoke.outputs.release_smoke_ok != 'true'
        env:
          FAILED_CHECKS: ${{ steps.release_flow_smoke.outputs.release_smoke_failed_checks }}
          SMOKE_ERROR: ${{ steps.release_flow_smoke.outputs.release_smoke_error }}
        run: |
          echo "release-flow smoke failed"
          if [ -n "$FAILED_CHECKS" ]; then
            echo "failed checks: $FAILED_CHECKS"
          fi
          if [ -n "$SMOKE_ERROR" ]; then
            echo "error: $SMOKE_ERROR"
          fi
          exit 1
