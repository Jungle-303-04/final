name: Integration Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: aws-integration-smoke
  cancel-in-progress: false

jobs:
  aws-smoke:
    name: AWS EKS event flow smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Dispatch AWS CD with smoke enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run aws-cd.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f create_clusters=false \
            -f ensure_ebs_csi=false \
            -f bootstrap_admin=false \
            -f register_targets=false \
            -f run_smoke=true

          sleep 10
          run_id="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow aws-cd.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          test -n "${run_id}"
          gh run watch "${run_id}" --repo "${{ github.repository }}" --exit-status
