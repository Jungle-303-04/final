name: Promote Dev To Main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-dev-to-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify dev before promotion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7.0.0
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Run repository checks
        run: bash scripts/test.sh

      - name: Build service image
        run: bash scripts/build-image.sh

  promote:
    name: Merge dev into main
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ vars.AUTO_PROMOTE_DEV_TO_MAIN != '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        run: |
          set -euo pipefail
          git fetch origin main dev
          git checkout -B main origin/main
          git merge --no-ff origin/dev -m "ci: dev 자동 승격 / main 병합 / 배포 준비"
          git push origin HEAD:main
