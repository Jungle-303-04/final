name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  python-checks:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check src scripts tests

      - name: Ruff format check
        run: uv run ruff format --check src scripts tests

      - name: Import boundaries (services → domains → packages)
        run: PYTHONPATH=src uv run lint-imports --config .importlinter

      - name: Python compile
        run: python -m compileall -q src scripts

      - name: README structure drift check
        run: bash scripts/readme-structure-check.sh

      - name: FD docs link check
        run: bash scripts/fd-link-check.sh

      - name: No tracked env/secret files
        run: |
          # frontend/.env.production 은 vite 관례 파일 — 시크릿 없이 VITE_API_BASE 플래그만 담음(허용).
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.example$' | grep -v '^frontend/\.env\.production$' || true)
          if [ -n "$tracked" ]; then
            echo "추적 중인 env 파일 발견(시크릿 커밋 금지): $tracked"
            exit 1
          fi

      - name: Unit tests
        run: uv run pytest -q

  frontend-checks:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend gate (tsc + eslint + build)
        run: bash scripts/frontend-check.sh

  manifest-checks:
    name: Kubernetes manifest checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Render and parse manifests without Docker
        run: bash scripts/manifest-check.sh
