name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-checks:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check services packages tests

      - name: Python compile
        run: python -m compileall -q services packages

      - name: Unit tests
        run: uv run pytest -q

  manifest-checks:
    name: Kubernetes manifest and image checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render management manifests
        run: kubectl kustomize deploy/management >/tmp/management-rendered.yaml

      - name: Validate target manifests client-side
        run: |
          sed 's#__MANAGEMENT_BASE_URL__#http://management-api-gateway.management:8000#g' \
            deploy/target/target.yaml \
            | kubectl apply --dry-run=client --validate=false -f -

      - name: Build service image
        run: docker build -f services/Dockerfile -t service:ci .
