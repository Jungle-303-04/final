name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  python-checks:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check src scripts tests

      - name: Ruff format check
        run: uv run ruff format --check src scripts tests

      - name: Import boundaries (services → domains → packages)
        run: PYTHONPATH=src uv run lint-imports --config .importlinter

      - name: Python compile
        run: python -m compileall -q src scripts

      - name: Unit tests
        run: uv run pytest -q

  manifest-checks:
    name: Kubernetes manifest checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Render and parse manifests without Docker
        run: bash scripts/manifest-check.sh
