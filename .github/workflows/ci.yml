name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  python-checks:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check src scripts tests

      - name: Ruff format check
        run: uv run ruff format --check src scripts tests

      - name: Import boundaries (services → domains → packages)
        run: PYTHONPATH=src uv run lint-imports --config .importlinter

      - name: Python compile
        run: python -m compileall -q src scripts

      - name: Unit tests
        run: uv run pytest -q

  manifest-checks:
    name: Kubernetes manifest and image checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate management manifests offline
        run: |
          kubectl kustomize deploy/management \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
              -strict \
              -ignore-missing-schemas \
              -summary

      - name: Validate target manifests offline
        run: |
          sed 's#__MANAGEMENT_BASE_URL__#http://api-gateway.management:8000#g' \
            deploy/target/target.yaml \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
              -strict \
              -ignore-missing-schemas \
              -summary

      - name: Build service image
        run: docker build -f src/services/Dockerfile -t service:ci .

      - name: Container import smoke
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://user:pass@postgresql:5432/service \
            service:ci python - <<'PY'
          import sys

          import sqlalchemy
          from packages.storage.database import Database

          sys.path.insert(0, "/app/src/services/gateway/api-gateway")
          from auth import RedisSessionStore
          from gateway import ApiGateway

          assert sqlalchemy.__version__
          assert Database().sqlalchemy_url.startswith("postgresql+psycopg://")
          assert RedisSessionStore().url.startswith("redis://")
          assert ApiGateway().app.title
          PY
