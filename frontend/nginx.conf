# console — same-origin reverse proxy (docs/frontend-framework-design.md 배포 기준)
# browser 는 이 origin 하나만 본다: 정적 자산 + /api/* 프록시. token 은 cookie 로만 흐른다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    set $api_upstream http://api-gateway.management.svc.cluster.local:8000;
    set $realtime_upstream http://realtime-gateway.management.svc.cluster.local:8000;

    # WebSocket — /api/live/* -> realtime-gateway (upgrade 보존)
    location /api/live/ {
        proxy_pass $realtime_upstream/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 인터넷 요청이 내부 mTLS 프록시 신원을 위조하지 못하게 항상 제거한다.
        proxy_set_header X-Kubeheal-Internal-Auth "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST — /api/* -> api-gateway (prefix 제거)
    location /api/ {
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Kubeheal-Internal-Auth "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 빌드 자산은 해시 파일명 — 장기 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA entry 는 chunk manifest 역할을 하므로 배포마다 새로 받아야 한다.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
