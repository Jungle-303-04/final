<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let storedTheme = null;
        let locale = "ko";
        let sidebarState = "expanded";
        try {
          storedTheme = window.localStorage.getItem("opsia-theme");
          const storedLocale = window.localStorage.getItem("opsia.locale");
          const storedSidebarState = window.localStorage.getItem("kyro.sidebar.state");
          if (storedLocale === "en" || storedLocale === "ko") locale = storedLocale;
          if (storedSidebarState === "collapsed" || storedSidebarState === "expanded") {
            sidebarState = storedSidebarState;
          }
        } catch {
          storedTheme = null;
        }
        if (window.matchMedia?.("(max-width: 1100px)").matches) sidebarState = "collapsed";
        const selectedTheme = storedTheme === "dark" || storedTheme === "light"
          ? storedTheme
          : storedTheme === "system"
            ? storedTheme
            : "light";
        const systemDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
        const isDark = selectedTheme === "dark" || (selectedTheme === "system" && systemDark);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        document.documentElement.lang = locale;
        document.documentElement.dataset.productSidebarState = sidebarState;
      })();
    </script>
    <style>
      :root {
        --background: #fafafc;
        --foreground: #111318;
      }
      :root.dark {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
      }
      html,
      body,
      #root {
        min-height: 100%;
        color: var(--foreground);
        background: var(--background);
      }
      body {
        margin: 0;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Provider-neutral Kubernetes operations and GitOps control plane."
    />
    <meta name="application-name" content="Kyro" />
    <meta name="apple-mobile-web-app-title" content="Kyro" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Kyro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
