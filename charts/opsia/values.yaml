image:
  repository: ghcr.io/opsia/opsia
  tag: ""
  pullPolicy: IfNotPresent

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

console:
  image:
    repository: ghcr.io/opsia/opsia-console
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgresql:
  image: postgres:17-alpine
  auth:
    database: opsia
    username: opsia
    password: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

agent:
  clusterId: opsia-self
  token: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

initialAdmin:
  email: admin@opsia.local
  password: ""

llm:
  provider: ""
  apiKey: ""
  model: ""

scm:
  provider: github
  repository: ""
  baseBranch: main
  credentialVersion: ""
  github:
    apiBase: ""
    tokenSecretName: ""
    tokenSecretKey: token

service:
  type: ClusterIP
  port: 80

access:
  mode: auto
  externalUrl: ""
  host: ""
  nodePort: 30080
  loadBalancer:
    annotations: {}
    tlsTermination: disabled
  ingress:
    className: ""
    annotations: {}
    tls:
      enabled: false
      secretName: ""

nameOverride: ""
fullnameOverride: ""
