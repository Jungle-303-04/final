name: sw-ai-final

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: final-api-dev:local
    command: uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-sw-ai-final}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: /opt/venv
    ports:
      - "${DEV_PORT:-8000}:8000"
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  uv-cache:
