<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let storedTheme = null;
        try {
          storedTheme = window.localStorage.getItem("kubeheal-theme");
        } catch {
          storedTheme = null;
        }
        const systemDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
        const isDark = storedTheme === "dark" || (storedTheme !== "light" && systemDark);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
    <style>
      :root {
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
      }
      :root.dark {
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
      }
      html,
      body,
      #root {
        min-height: 100%;
        color: var(--foreground);
        background: var(--background);
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pinned, source-complete shadcn/ui component, chart, and block reference lab."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>shadcn/ui Official Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
