# 팀 공유 포맷/린트 훅 — git 커밋 시 자동 적용(에디터 무관).
# 설치: make hooks  (또는: uv run pre-commit install)
# ruff 버전은 uv.lock 과 동일하게 고정 → 팀 전원 같은 포맷 결과.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: dev-full-gate
        name: dev 전체 게이트
        entry: bash scripts/pre-push-gate.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
