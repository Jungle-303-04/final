services:
  demo-metrics:
    image: python:3.13-slim
    working_dir: /app
    command: ["python", "metrics_server.py"]
    volumes:
      - ./app:/app:ro
    ports:
      - "18001:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=1h"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "19090:9090"
    depends_on:
      - demo-metrics

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "13100:3100"

  demo-log-writer:
    image: python:3.13-slim
    working_dir: /app
    command: ["python", "write_logs.py"]
    environment:
      LOKI_URL: "http://loki:3100"
      LOG_FILE: "/shared/demo-app.log"
    volumes:
      - ./app:/app:ro
      - demo-logs:/shared
    depends_on:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - demo-logs:/shared:ro
    depends_on:
      - demo-log-writer

  evidence-demo:
    image: python:3.13-slim
    working_dir: /app
    command: ["python", "evidence_demo.py"]
    environment:
      PROMETHEUS_URL: "http://prometheus:9090"
      LOKI_URL: "http://loki:3100"
    volumes:
      - ./app:/app:ro
    depends_on:
      - prometheus
      - loki
      - demo-log-writer

volumes:
  demo-logs:
