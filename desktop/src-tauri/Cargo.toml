[package]
name = "opsia-desktop"
version = "0.1.0"
description = "Opsia desktop shell"
edition = "2024"
rust-version = "1.85"

[lib]
name = "opsia_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "2.5"

[dependencies]
base64 = "0.22"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
tauri = "2.11"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
time = { version = "0.3", features = ["formatting"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
