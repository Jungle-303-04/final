[project]
name = "services"
version = "0.1.0"
description = "Event-driven Kubernetes operations platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "nats-py>=2.11.0",
    "psycopg[binary]>=3.2.0",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# 가독성 폭(클린코드 기준): 80은 좁아 의미 없는 줄바꿈을 부르고, 1000은 과함 → 100.
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 폭은 포매터가 관리, 린트로 길이 트집 안 잡음
