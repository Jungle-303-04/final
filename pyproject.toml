[project]
name = "services"
version = "0.1.0"
description = "Event-driven Kubernetes operations platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "nats-py>=2.11.0",
    "psycopg[binary]>=3.2.0",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# 줄 길이 제한 비활성화: 포매터가 강제로 줄을 쪼개지 않도록 매우 크게.
line-length = 1000
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # Line too long 비활성화
