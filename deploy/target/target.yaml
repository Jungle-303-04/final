---
# optional-node-collector exposes demo node metrics on /metrics.
# Prometheus discovers it through the scrape annotations below.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: optional-node-collector
  namespace: target
spec:
  selector:
    matchLabels:
      app: optional-node-collector
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
        prometheus.io/scrape: "true"
      labels:
        app: optional-node-collector
    spec:
      containers:
        - name: node-collector
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "services/target/node-collector/app.py"]
          env:
            - name: PORT
              value: "9100"
            - name: COLLECT_INTERVAL_SECONDS
              value: "15"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9100
---
# target-cluster-agent sends collected evidence to the management plane.
# Prometheus and Loki URLs point to the real Helm-installed services in this namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-cluster-agent
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-cluster-agent
  template:
    metadata:
      labels:
        app: target-cluster-agent
    spec:
      serviceAccountName: target-cluster-agent
      containers:
        - name: target-cluster-agent
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "services/target/target-cluster-agent/app.py"]
          env:
            - name: TARGET_CLUSTER_ID
              value: target-cluster-01
            - name: MANAGEMENT_BASE_URL
              value: "__MANAGEMENT_BASE_URL__"
            - name: PROMETHEUS_BASE_URL
              value: "http://prometheus.target.svc:9090"
            - name: LOKI_BASE_URL
              value: "http://loki-gateway.target.svc"
            - name: EVIDENCE_INTERVAL_SECONDS
              value: "8"
