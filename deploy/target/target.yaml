apiVersion: v1
kind: Namespace
metadata:
  name: target
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-agent
  namespace: target
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-agent-read
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-agent-read
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: target
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-agent-target-manage
  namespace: target
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-agent-target-manage
  namespace: target
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-agent-target-manage
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: target
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-agent-sandbox-write
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-agent-sandbox-write
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-agent-sandbox-write
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: target
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-prometheus
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-prometheus
  template:
    metadata:
      labels:
        app: fake-prometheus
    spec:
      containers:
        - name: fake-prometheus
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/target/cluster-agent/fake_telemetry.py"]
          env:
            - name: FAKE_TELEMETRY_KIND
              value: prometheus
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-prometheus
  namespace: target
spec:
  selector:
    app: fake-prometheus
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-loki
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-loki
  template:
    metadata:
      labels:
        app: fake-loki
    spec:
      containers:
        - name: fake-loki
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/target/cluster-agent/fake_telemetry.py"]
          env:
            - name: FAKE_TELEMETRY_KIND
              value: loki
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-loki
  namespace: target
spec:
  selector:
    app: fake-loki
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-otel
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-otel
  template:
    metadata:
      labels:
        app: fake-otel
    spec:
      containers:
        - name: fake-otel
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/target/cluster-agent/fake_telemetry.py"]
          env:
            - name: FAKE_TELEMETRY_KIND
              value: otel
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-otel
  namespace: target
spec:
  selector:
    app: fake-otel
  ports:
    - port: 8000
      targetPort: 8000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-agent
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-agent
  template:
    metadata:
      labels:
        app: cluster-agent
    spec:
      serviceAccountName: cluster-agent
      containers:
        - name: cluster-agent
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/target/cluster-agent/app.py"]
          envFrom:
            - configMapRef:
                name: target-runtime-config
            - secretRef:
                name: target-runtime-secret
          env:
            - name: MANAGEMENT_BASE_URL
              value: "__MANAGEMENT_BASE_URL__"
            - name: NODE_COLLECTOR_ENABLED
              value: "true"
            - name: NODE_COLLECTOR_IMAGE
              value: service:local
            - name: NODE_COLLECTOR_NAMESPACE
              value: target
