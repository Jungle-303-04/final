apiVersion: v1
kind: Namespace
metadata:
  name: target
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: target-cluster-agent
  namespace: target
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: target-cluster-agent-read
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: target-cluster-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: target-cluster-agent-read
subjects:
  - kind: ServiceAccount
    name: target-cluster-agent
    namespace: target
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: target-cluster-agent-sandbox-write
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: target-cluster-agent-sandbox-write
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: target-cluster-agent-sandbox-write
subjects:
  - kind: ServiceAccount
    name: target-cluster-agent
    namespace: target
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-prometheus
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-prometheus
  template:
    metadata:
      labels:
        app: fake-prometheus
    spec:
      containers:
        - name: fake-prometheus
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "services/target/target-cluster-agent/fake_prometheus.py"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-prometheus
  namespace: target
spec:
  selector:
    app: fake-prometheus
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-loki
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-loki
  template:
    metadata:
      labels:
        app: fake-loki
    spec:
      containers:
        - name: fake-loki
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "services/target/target-cluster-agent/fake_loki.py"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-loki
  namespace: target
spec:
  selector:
    app: fake-loki
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-otel
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-otel
  template:
    metadata:
      labels:
        app: fake-otel
    spec:
      containers:
        - name: fake-otel
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "services/target/target-cluster-agent/fake_otel.py"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-otel
  namespace: target
spec:
  selector:
    app: fake-otel
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: optional-node-collector
  namespace: target
spec:
  selector:
    matchLabels:
      app: optional-node-collector
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9100"
        prometheus.io/scrape: "true"
      labels:
        app: optional-node-collector
    spec:
      containers:
        - name: node-collector
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "services/target/node-collector/app.py"]
          env:
            - name: PORT
              value: "9100"
            - name: COLLECT_INTERVAL_SECONDS
              value: "15"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-cluster-agent
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-cluster-agent
  template:
    metadata:
      labels:
        app: target-cluster-agent
    spec:
      serviceAccountName: target-cluster-agent
      containers:
        - name: target-cluster-agent
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "services/target/target-cluster-agent/app.py"]
          env:
            - name: TARGET_CLUSTER_ID
              value: target-cluster-01
            - name: MANAGEMENT_BASE_URL
              value: "__MANAGEMENT_BASE_URL__"
            - name: EVIDENCE_INTERVAL_SECONDS
              value: "8"
