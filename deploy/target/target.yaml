# =============================================================================
# 샘플/CI 스키마 검증용 매니페스트 — 단독 배포 대상 아님.
#
# 실제 cluster-agent 설치 매니페스트는 런타임에 api-gateway 의
# target 도메인(src/domains/target/router.py: target_install_manifest)이
# 클러스터 등록 요청마다 생성/적용한다. 이 파일은 그 출력의 정적 참조본으로,
# 생성기가 주입하는 target-runtime-config(ConfigMap)/target-runtime-secret(Secret)
# 은 의도적으로 빠져 있다. `kubectl apply -f` 로 직접 띄우면 cluster-agent 가
# 그 두 리소스를 envFrom 으로 찾지 못해 기동하지 않는다.
# 용도: kubeconform 등 CI 스키마 검증 + 리뷰용 형상 참고.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: target
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-agent
  namespace: target
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-agent-read
rules:
  # Read-only access to cluster objects used for evidence and command context.
  - apiGroups: [""]
    resources: ["pods", "events", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Read-only access to workload controllers.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
# Bind the read-only ClusterRole above to the cluster-agent ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-agent-read
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: target
---
# Write permissions for target-agent owned resources only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-agent-self-manage
  namespace: target
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["target-agent-policy"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cluster-agent"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-agent-self-manage
  namespace: target
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-agent-self-manage
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: target
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: target-agent-policy
  namespace: target
data:
  owner: cluster-agent
---
# Write permissions are scoped to sandbox only.
# The agent can patch demo workloads/configmaps there without mutating target telemetry.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-agent-target-manage
  namespace: target
rules:
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
# Bind sandbox write permissions to the cluster-agent ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-agent-target-manage
  namespace: target
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-agent-target-manage
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: target
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-agent-sandbox-write
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-agent-sandbox-write
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-agent-sandbox-write
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: target
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-prometheus
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-prometheus
  template:
    metadata:
      labels:
        app: fake-prometheus
    spec:
      containers:
        - name: fake-prometheus
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/target/cluster-agent/fake_telemetry.py"]
          env:
            - name: FAKE_TELEMETRY_KIND
              value: prometheus
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-prometheus
  namespace: target
spec:
  selector:
    app: fake-prometheus
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-loki
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-loki
  template:
    metadata:
      labels:
        app: fake-loki
    spec:
      containers:
        - name: fake-loki
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/target/cluster-agent/fake_telemetry.py"]
          env:
            - name: FAKE_TELEMETRY_KIND
              value: loki
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-loki
  namespace: target
spec:
  selector:
    app: fake-loki
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-otel
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-otel
  template:
    metadata:
      labels:
        app: fake-otel
    spec:
      containers:
        - name: fake-otel
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/target/cluster-agent/fake_telemetry.py"]
          env:
            - name: FAKE_TELEMETRY_KIND
              value: otel
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-otel
  namespace: target
spec:
  selector:
    app: fake-otel
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: target-agent-state
  namespace: target
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-agent
  namespace: target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-agent
  template:
    metadata:
      labels:
        app: cluster-agent
    spec:
      serviceAccountName: cluster-agent
      containers:
        - name: cluster-agent
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/target/cluster-agent/app.py"]
          envFrom:
            - configMapRef:
                name: target-runtime-config
            - secretRef:
                name: target-runtime-secret
          env:
            - name: MANAGEMENT_BASE_URL
              value: "__MANAGEMENT_BASE_URL__"
            - name: NODE_COLLECTOR_ENABLED
              value: "true"
            - name: NODE_COLLECTOR_IMAGE
              value: service:local
            - name: NODE_COLLECTOR_NAMESPACE
              value: target
            - name: EVIDENCE_QUEUE_DB_PATH
              value: /var/lib/target-agent/evidence-queue.db
            - name: AGENT_CONTROL_DB_PATH
              value: /var/lib/target-agent/agent-control.db
            - name: COMMAND_OUTBOX_DB_PATH
              value: /var/lib/target-agent/command-outbox.db
            - name: OTEL_SERVICE_NAME
              value: target-cluster-agent
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://opentelemetry-collector.target.svc:4318/v1/traces
          volumeMounts:
            - name: target-agent-state
              mountPath: /var/lib/target-agent
      volumes:
        - name: target-agent-state
          persistentVolumeClaim:
            claimName: target-agent-state
