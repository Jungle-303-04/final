# Values for the prometheus-community/prometheus Helm chart.
# This file controls how Prometheus is installed in the target Kubernetes cluster.

server:
  # Keep the server Service name aligned with target-cluster-agent's PROMETHEUS_BASE_URL.
  fullnameOverride: prometheus

  persistentVolume:
    # Keep collected time-series data across Prometheus Pod restarts.
    enabled: true

  service:
    # Expose Prometheus only inside the target cluster.
    type: ClusterIP
    servicePort: 9090

kube-state-metrics:
  # Converts Kubernetes object state into metrics such as kube_pod_info.
  enabled: true

prometheus-node-exporter:
  # Exposes node CPU, memory, disk, and network metrics from each Kubernetes node.
  enabled: true
  hostRootFsMount:
    # Friendlier for Docker Desktop/kind local clusters.
    enabled: false

alertmanager:
  # Receives alerts generated by Prometheus.
  enabled: true
  persistence:
    enabled: true
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "9093"

prometheus-pushgateway:
  # Allows short-lived batch jobs to push metrics before they exit.
  enabled: true
  serviceAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9091"
