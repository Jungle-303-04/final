# Values for the Grafana Loki Helm chart.
# This file controls how Loki is installed in the target Kubernetes cluster.

loki:
  # Keep local demo queries simple by disabling multi-tenant auth.
  auth_enabled: false

  commonConfig:
    # Single-replica monolithic mode requires replication factor 1.
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    # Local kind-friendly storage. For production, replace with object storage.
    type: filesystem

  pattern_ingester:
    enabled: true

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

  ruler:
    enable_api: true

deploymentMode: Monolithic

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi

gateway:
  # Keep Loki reachable inside the target cluster.
  enabled: true
  service:
    type: ClusterIP

minio:
  # We use filesystem storage for local development instead of the MinIO subchart.
  enabled: false

# Zero out all non-monolithic deployment modes.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
