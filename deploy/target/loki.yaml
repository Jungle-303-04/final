# Grafana Loki Helm chart 값

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    allow_structured_metadata: true
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi

# kind/local 대상 클러스터는 작게 구성. Loki chart는 기본으로
# memcached result/chunk cache 활성화, chunk cache request는 약 9.8Gi
# production 설치에서는 cache size 조정 또는 재활성화
chunksCache:
  enabled: false

resultsCache:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
