# Values for the Grafana Alloy Helm chart.
# Alloy is used here as the log collection pipeline that sends Kubernetes Pod logs to Loki.

controller:
  # Run one Alloy Pod for the local kind MVP.
  # The Alloy config below uses the Kubernetes API, so a single deployment can watch Pod logs.
  type: deployment
  replicas: 1

alloy:
  configMap:
    # Alloy's pipeline config. The flow is:
    # discover Pods -> turn Kubernetes metadata into Loki labels -> read Pod logs -> push to Loki.

    # Alloy configuration string
    content: |
      // Find Pods in the target namespace through the Kubernetes API.
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["target"]
        }
      }

      // Convert Kubernetes discovery metadata into labels that LogQL can query.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Enables LogQL selectors such as {namespace="target"}.
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        // Enables selectors such as {app="target-cluster-agent"}.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }

        // Keeps the original Pod name available in Loki streams.
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        // Keeps the container name available when a Pod has multiple containers.
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      // Tail the discovered Kubernetes Pod logs and pass log entries to loki.write.
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.local.receiver]
      }

      // Push collected log entries into the in-cluster Loki gateway.
      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.target.svc/loki/api/v1/push"
        }
      }
