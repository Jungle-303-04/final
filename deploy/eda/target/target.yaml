apiVersion: v1
kind: Namespace
metadata:
  name: eda-target
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: target-cluster-agent
  namespace: eda-target
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: target-cluster-agent-read
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: target-cluster-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: target-cluster-agent-read
subjects:
  - kind: ServiceAccount
    name: target-cluster-agent
    namespace: eda-target
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: target-cluster-agent-sandbox-write
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: target-cluster-agent-sandbox-write
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: target-cluster-agent-sandbox-write
subjects:
  - kind: ServiceAccount
    name: target-cluster-agent
    namespace: eda-target
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-prometheus
  namespace: eda-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-prometheus
  template:
    metadata:
      labels:
        app: fake-prometheus
    spec:
      containers:
        - name: fake-prometheus
          image: eda-platform:local
          imagePullPolicy: IfNotPresent
          args: ["fake-prometheus"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-prometheus
  namespace: eda-target
spec:
  selector:
    app: fake-prometheus
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-loki
  namespace: eda-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-loki
  template:
    metadata:
      labels:
        app: fake-loki
    spec:
      containers:
        - name: fake-loki
          image: eda-platform:local
          imagePullPolicy: IfNotPresent
          args: ["fake-loki"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-loki
  namespace: eda-target
spec:
  selector:
    app: fake-loki
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-otel
  namespace: eda-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-otel
  template:
    metadata:
      labels:
        app: fake-otel
    spec:
      containers:
        - name: fake-otel
          image: eda-platform:local
          imagePullPolicy: IfNotPresent
          args: ["fake-otel"]
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fake-otel
  namespace: eda-target
spec:
  selector:
    app: fake-otel
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: optional-node-collector
  namespace: eda-target
spec:
  selector:
    matchLabels:
      app: optional-node-collector
  template:
    metadata:
      labels:
        app: optional-node-collector
    spec:
      containers:
        - name: node-collector
          image: eda-platform:local
          imagePullPolicy: IfNotPresent
          args: ["node-collector"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-cluster-agent
  namespace: eda-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-cluster-agent
  template:
    metadata:
      labels:
        app: target-cluster-agent
    spec:
      serviceAccountName: target-cluster-agent
      containers:
        - name: target-cluster-agent
          image: eda-platform:local
          imagePullPolicy: IfNotPresent
          args: ["target-agent"]
          env:
            - name: TARGET_CLUSTER_ID
              value: target-cluster-01
            - name: MANAGEMENT_BASE_URL
              value: "__MANAGEMENT_BASE_URL__"
            - name: EVIDENCE_INTERVAL_SECONDS
              value: "8"
