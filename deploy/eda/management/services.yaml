apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-api-gateway
  namespace: eda-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-api-gateway
  template:
    metadata:
      labels:
        app: management-api-gateway
    spec:
      containers:
        - name: gateway
          image: eda-platform:local
          imagePullPolicy: IfNotPresent
          args: ["gateway"]
          env:
            - name: DATABASE_URL
              value: postgresql://eda:eda@postgresql:5432/eda
            - name: NATS_URL
              value: nats://nats:4222
            - name: REDIS_URL
              value: redis://redis:6379/0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: management-api-gateway
  namespace: eda-management
spec:
  type: NodePort
  selector:
    app: management-api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
