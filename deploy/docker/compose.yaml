name: project-k

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dev
    image: final-api-dev:local
    command: uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_NAME: ${APP_NAME:-Project K}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://final:final@db:5432/final}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: /opt/venv
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DEV_PORT:-8000}:8000"
    volumes:
      - ../..:/app
      - uv-cache:/root/.cache/uv
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-final}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-final}
      POSTGRES_DB: ${POSTGRES_DB:-final}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-final} -d ${POSTGRES_DB:-final}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  uv-cache:
