apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gateway
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "services/api-gateway/app.py"]
          env:
            - name: DATABASE_URL
              value: postgresql://service:service@postgresql:5432/service
            - name: NATS_URL
              value: nats://nats:4222
            - name: REDIS_URL
              value: redis://redis:6379/0
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: management
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
