apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: gateway
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/api-gateway/app.py"]
          envFrom:
            - configMapRef:
                name: management-runtime-config
            - secretRef:
                name: management-runtime-secret
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: management
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-worker
  namespace: management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-worker
  template:
    metadata:
      labels:
        app: alert-worker
    spec:
      containers:
        - name: worker
          image: service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/alert-worker/app.py"]
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/heartbeat')<30 else 1)"
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: management-runtime-config
            - secretRef:
                name: management-runtime-secret
---
