# realtime-gateway — cluster-agent live stream 수신 + browser WebSocket fan-out.
# node-collector 는 연결하지 않음(/metrics 는 Prometheus scrape 경로 유지).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-gateway
  namespace: management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-gateway
  template:
    metadata:
      labels:
        app: realtime-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: kubeheal-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          command: ["python", "src/services/realtime/realtime-gateway/app.py"]
          envFrom:
            - configMapRef:
                name: management-runtime-config
            - secretRef:
                name: management-runtime-secret
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-gateway
  namespace: management
spec:
  type: NodePort
  selector:
    app: realtime-gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30090
---
