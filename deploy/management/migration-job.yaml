apiVersion: batch/v1
kind: Job
metadata:
  name: management-database-migration
  namespace: management
  labels:
    app: management-database-migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: management-database-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: kubeheal-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "packages.storage.migration", "upgrade"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: management-runtime-secret
                  key: COMMAND_NOTIFY_DATABASE_URL
            - name: MIGRATION_EXPECTED_HEAD
              value: "20260714_0200"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
