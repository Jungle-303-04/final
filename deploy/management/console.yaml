# console — 운영 콘솔 frontend (nginx 정적 서빙 + same-origin /api 프록시).
# browser 는 이 Service 만 바라본다. api-gateway/realtime-gateway 는 cluster 내부로만 프록시된다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: management
spec:
  replicas: 1
  # 무중단 교체 — 기존 pod 를 유지한 채 새 pod 가 ready 된 뒤에만 종료한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          # 배포 파이프라인이 같은 dev SHA에서 빌드한 ECR digest로만 교체한다.
          image: 183548421506.dkr.ecr.ap-northeast-2.amazonaws.com/kubernetes-ops-console@sha256:8c49f7bf8a10f5b9edb8de798cbe94d78ca29d03699bc2f3686c1636ec397978
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: management
spec:
  type: LoadBalancer
  selector:
    app: console
  ports:
    - name: http
      port: 80
      targetPort: http
