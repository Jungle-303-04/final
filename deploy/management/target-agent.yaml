apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-agent
  namespace: management
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: management-cluster-agent-read
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: management-cluster-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: management-cluster-agent-read
subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: management
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: target-agent-policy
  namespace: management
data:
  owner: cluster-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-agent
  namespace: management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-agent
  template:
    metadata:
      labels:
        app: cluster-agent
    spec:
      priorityClassName: gitops-control-critical
      serviceAccountName: cluster-agent
      containers:
        - name: agent
          image: kubeheal-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "src/services/target/cluster-agent/app.py"]
          env:
            - name: MANAGEMENT_BASE_URL
              value: "http://api-gateway:8000"
            - name: REALTIME_GATEWAY_URL
              value: "ws://realtime-gateway.management.svc.cluster.local:8000"
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: target-runtime-secret
                  key: AGENT_TOKEN
            - name: TARGET_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: management-runtime-config
                  key: MANAGEMENT_CLUSTER_ID
            - name: CLUSTER_ROLE
              value: "management"
            - name: BOOTSTRAP_MODE
              value: "management"
            - name: NODE_COLLECTOR_ENABLED
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: "target-cluster-agent"
            - name: PROMETHEUS_BASE_URL
              value: ""
            - name: LOKI_BASE_URL
              value: ""
            - name: TEMPO_BASE_URL
              value: ""
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: ""
            - name: EVIDENCE_INTERVAL_SECONDS
              value: "15"
            - name: POLICY_SYNC_INTERVAL_SECONDS
              value: "15"
            - name: RECONCILE_INTERVAL_SECONDS
              value: "30"
            - name: EVIDENCE_PROVIDER_WORKERS
              value: "kubernetes=1,metrics=0,logs=0,traces=0"
            - name: EVIDENCE_PROVIDER_MAX_WORKERS
              value: "kubernetes=2,metrics=0,logs=0,traces=0"
            - name: EVIDENCE_FAILURE_POLICY
              value: "allow_partial"
            - name: AGENT_CONTROL_DB_PATH
              value: "/data/agent-control.db"
            - name: COMMAND_OUTBOX_DB_PATH
              value: "/data/command-outbox.db"
          volumeMounts:
            - name: agent-control-data
              mountPath: /data
      volumes:
        - name: agent-control-data
          emptyDir: {}
