# mTLS 개발 콘솔 — Cloudflare Tunnel에서만 접근하는 세션 없는 전용 프록시.
apiVersion: v1
kind: ConfigMap
metadata:
  name: console-dev-nginx
  namespace: management
data:
  default.conf.template: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 2m;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;

        location /api/live/ {
            proxy_pass http://realtime-gateway.management.svc.cluster.local:8000/live/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Kubeheal-Internal-Auth "${TRUSTED_PROXY_AUTH_SECRET}";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://api-gateway.management.svc.cluster.local:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Kubeheal-Internal-Auth "${TRUSTED_PROXY_AUTH_SECRET}";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store";
            try_files /index.html =404;
        }

        location / {
            expires -1;
            add_header Cache-Control "no-store";
            try_files $uri /index.html;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-dev
  namespace: management
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: console-dev
  template:
    metadata:
      labels:
        app: console-dev
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: console-dev
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          # 배포 파이프라인이 같은 dev SHA에서 빌드한 ECR digest로만 교체한다.
          image: 183548421506.dkr.ecr.ap-northeast-2.amazonaws.com/kubernetes-ops-console@sha256:8c49f7bf8a10f5b9edb8de798cbe94d78ca29d03699bc2f3686c1636ec397978
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: TRUSTED_PROXY_AUTH_SECRET
            - name: TRUSTED_PROXY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: management-runtime-secret
                  key: TRUSTED_PROXY_AUTH_SECRET
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-template
          configMap:
            name: console-dev-nginx
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: console-dev
  namespace: management
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: console-dev
---
apiVersion: v1
kind: Service
metadata:
  name: console-dev
  namespace: management
spec:
  type: ClusterIP
  selector:
    app: console-dev
  ports:
    - name: http
      port: 80
      targetPort: http
