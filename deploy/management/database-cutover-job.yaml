apiVersion: batch/v1
kind: Job
metadata:
  name: management-database-cutover
  namespace: management
  labels:
    app: management-database-cutover
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: management-database-cutover
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cutover
          image: 183548421506.dkr.ecr.ap-northeast-2.amazonaws.com/kubernetes-ops-service@sha256:132cbc945004812ae3367c21a3408da8f3c9ab1a01b5870ffdea1157c83f5d0a
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - >-
              python -m packages.storage.baseline bootstrap &&
              python -m packages.storage.data_cutover copy
          env:
            - name: BASELINE_SOURCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: first-deploy-database-cutover
                  key: BASELINE_SOURCE_DATABASE_URL
            - name: BASELINE_TARGET_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: first-deploy-database-cutover
                  key: BASELINE_TARGET_DATABASE_URL
            - name: BASELINE_CONFIRM_SOURCE_COMMIT
              value: "017b2485b2c408c2f7e928379ebf6541526d32ab"
            - name: BASELINE_CONFIRM_EMPTY_TARGET
              value: isolated-empty-database
            - name: BASELINE_CONFIRM_SOURCE_FROZEN
              value: source-writes-disabled
            - name: BASELINE_CONFIRM_TARGET_ISOLATED
              value: isolated-versioned-target
            - name: MIGRATION_EXPECTED_HEAD
              value: "20260714_0345"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
